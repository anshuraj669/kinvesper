<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kinvesper Settings</title>
<style>
  :root {
    color-scheme: light;
    --base: #e9eef0; --ink: #0f1a19; --ink-2: #33423f; --muted: #556461;
    --panel: #f7fafa; --bg: rgba(15,30,28,.055); --wash: rgba(15,30,28,.055); --line: rgba(15,30,28,.11);
    --glass: rgba(255,255,255,.58); --glass-strong: rgba(255,255,255,.80); --glass-edge: rgba(255,255,255,.75);
    --well: rgba(15,30,28,.06); --well-edge: rgba(15,30,28,.08); --glow: rgba(255,255,255,.55);
    --blob-1: #7dd3c8; --blob-2: #93b8f5; --blob-3: #c9b6f2; --blob-4: #f7c9a8;
    --depth: 0 1px 0 var(--glass-edge) inset, 0 0 0 1px rgba(255,255,255,.35) inset, 0 2px 6px rgba(20,40,40,.06), 0 24px 48px -18px rgba(20,40,60,.28);
    --depth-hover: 0 1px 0 var(--glass-edge) inset, 0 0 0 1px rgba(255,255,255,.45) inset, 0 4px 10px rgba(20,40,40,.08), 0 36px 64px -20px rgba(20,40,60,.36);
    --blur: blur(28px) saturate(170%); --shadow: var(--depth);
    --brand: #0f766e; --brand-ink: #ffffff; --brand-soft: rgba(15,118,110,.13);
    --good: #0b8f0b; --warning: #e9a00a; --warning-ink: #8a5a00; --critical: #d03b3b; --critical-soft: rgba(208,59,59,.10);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --base: #070b0f; --ink: #eef4f3; --ink-2: #c4d0cd; --muted: #97a6a3;
      --panel: #1d272c; --bg: rgba(0,0,0,.24); --wash: rgba(255,255,255,.06); --line: rgba(255,255,255,.10);
      --glass: rgba(38,48,54,.46); --glass-strong: rgba(44,56,62,.76); --glass-edge: rgba(255,255,255,.16);
      --well: rgba(0,0,0,.24); --well-edge: rgba(255,255,255,.06); --glow: rgba(255,255,255,.10);
      --blob-1: #0e6b62; --blob-2: #1d3f8a; --blob-3: #4b2a7a; --blob-4: #7a3b1f;
      --depth: 0 1px 0 var(--glass-edge) inset, 0 0 0 1px rgba(255,255,255,.07) inset, 0 24px 56px -20px rgba(0,0,0,.7);
      --depth-hover: 0 1px 0 var(--glass-edge) inset, 0 0 0 1px rgba(255,255,255,.12) inset, 0 36px 72px -20px rgba(0,0,0,.8);
      --blur: blur(28px) saturate(170%); --shadow: var(--depth);
      --brand: #2dd4bf; --brand-ink: #04201c; --brand-soft: rgba(45,212,191,.16);
      --good: #34c759; --warning: #ffcc33; --warning-ink: #ffcc33; --critical: #ff6b63; --critical-soft: rgba(255,95,87,.14);
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --base: #070b0f; --ink: #eef4f3; --ink-2: #c4d0cd; --muted: #97a6a3;
    --panel: #1d272c; --bg: rgba(0,0,0,.24); --wash: rgba(255,255,255,.06); --line: rgba(255,255,255,.10);
    --glass: rgba(38,48,54,.46); --glass-strong: rgba(44,56,62,.76); --glass-edge: rgba(255,255,255,.16);
    --well: rgba(0,0,0,.24); --well-edge: rgba(255,255,255,.06); --glow: rgba(255,255,255,.10);
    --blob-1: #0e6b62; --blob-2: #1d3f8a; --blob-3: #4b2a7a; --blob-4: #7a3b1f;
    --depth: 0 1px 0 var(--glass-edge) inset, 0 0 0 1px rgba(255,255,255,.07) inset, 0 24px 56px -20px rgba(0,0,0,.7);
    --depth-hover: 0 1px 0 var(--glass-edge) inset, 0 0 0 1px rgba(255,255,255,.12) inset, 0 36px 72px -20px rgba(0,0,0,.8);
    --blur: blur(28px) saturate(170%); --shadow: var(--depth);
    --brand: #2dd4bf; --brand-ink: #04201c; --brand-soft: rgba(45,212,191,.16);
    --good: #34c759; --warning: #ffcc33; --warning-ink: #ffcc33; --critical: #ff6b63; --critical-soft: rgba(255,95,87,.14);
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; scroll-padding-top: 80px; }
  @media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  button { font: inherit; }
  :focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }
  header {
    position: sticky; top: 0; z-index: 5; display: flex; align-items: center; gap: 12px; padding: 12px 20px;
    background: var(--panel); border-bottom: 1px solid var(--line);
  }
  header h1 { font-size: 17px; margin: 0; font-weight: 650; }
  header h1 span { color: var(--muted); font-weight: 450; }
  .spacer { flex: 1; }
  .btn {
    display: inline-flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 600; padding: 8px 14px;
    border-radius: 10px; cursor: pointer; border: 1px solid var(--line); background: var(--panel); color: var(--ink);
    text-decoration: none; white-space: nowrap;
  }
  .btn svg { width: 16px; height: 16px; flex: none; }
  .btn:hover:not(:disabled) { border-color: var(--brand); }
  .btn.primary { background: var(--brand); border-color: var(--brand); color: var(--brand-ink); }
  .btn.quiet { border-color: transparent; background: none; color: var(--ink-2); padding: 6px 10px; }
  .btn.quiet:hover:not(:disabled) { background: var(--wash); border-color: transparent; }
  .btn.danger:hover:not(:disabled) { color: var(--critical); }
  .btn.small { font-size: 13px; padding: 5px 10px; }
  .btn:disabled { opacity: .55; cursor: default; }

  /* ---- layout: section nav + cards ---- */
  .layout { max-width: 1100px; margin: 0 auto; padding: 20px 20px 110px; display: grid; grid-template-columns: 220px 1fr; gap: 24px; align-items: start; }
  nav.sections { position: sticky; top: 76px; display: grid; gap: 2px; }
  nav.sections a {
    display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 9px; color: var(--ink-2);
    text-decoration: none; font-size: 14px; font-weight: 600;
  }
  nav.sections a:hover { background: var(--wash); }
  nav.sections a[aria-current="true"] { background: var(--brand-soft); color: var(--brand); }
  nav.sections .state { margin-left: auto; font-size: 12px; font-weight: 500; color: var(--muted); }
  .dot { width: 9px; height: 9px; border-radius: 50%; flex: none; background: var(--line); }
  .dot.good { background: var(--good); } .dot.warn { background: var(--warning); } .dot.bad { background: var(--critical); }
  main { display: grid; gap: 16px; min-width: 0; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow); padding: 20px 22px; }
  .card-head { display: flex; align-items: flex-start; gap: 12px; margin-bottom: 14px; }
  .card-head .grow { flex: 1; min-width: 0; }
  .card h2 { font-size: 16px; margin: 0 0 2px; font-weight: 650; }
  .card .sub { font-size: 13.5px; color: var(--muted); margin: 0; }
  .optional { font-size: 12px; font-weight: 600; color: var(--muted); background: var(--wash); padding: 1px 8px; border-radius: 999px; margin-left: 6px; vertical-align: 2px; }
  .progress-card { display: flex; align-items: center; gap: 16px; }
  .progress-card .bar-track { flex: 1; height: 8px; background: var(--wash); border-radius: 999px; overflow: hidden; }
  .progress-card .bar-track span { display: block; height: 100%; background: var(--good); border-radius: 999px; transition: width .3s; }
  .todo { margin: 12px 0 0; padding: 0; list-style: none; display: grid; gap: 6px; font-size: 14px; }
  .todo li { display: flex; gap: 8px; align-items: center; }
  .todo a { color: var(--brand); font-weight: 600; text-decoration: none; }
  .todo a:hover { text-decoration: underline; }

  /* ---- fields ---- */
  .grid { display: grid; gap: 14px 16px; grid-template-columns: repeat(2, 1fr); }
  .grid .wide { grid-column: 1 / -1; }
  .grid.three { grid-template-columns: 2fr 1.4fr 1.6fr; }
  .field { display: grid; gap: 5px; align-content: start; }
  .field > label { font-size: 13px; font-weight: 600; color: var(--ink-2); }
  .field .req { color: var(--critical); margin-left: 2px; }
  .hint { font-size: 12.5px; color: var(--muted); }
  .error-text { font-size: 12.5px; color: var(--critical); font-weight: 600; }
  input {
    font: inherit; font-size: 15px; padding: 9px 11px; border-radius: 9px; border: 1px solid var(--line);
    background: var(--bg); color: var(--ink); width: 100%; min-width: 0;
  }
  input:hover { border-color: color-mix(in srgb, var(--brand) 35%, var(--line)); }
  input[aria-invalid="true"] { border-color: var(--critical); background: var(--critical-soft); }
  .presets { display: flex; gap: 6px; flex-wrap: wrap; }
  .preset { font-size: 13px; padding: 4px 10px; border-radius: 999px; border: 1px solid var(--line); background: var(--panel); color: var(--ink-2); cursor: pointer; }
  .preset[aria-pressed="true"] { background: var(--brand-soft); border-color: var(--brand); color: var(--brand); font-weight: 600; }
  .note { font-size: 13px; color: var(--ink-2); margin-top: 12px; display: flex; gap: 8px; align-items: flex-start; padding: 9px 12px; border-radius: 10px; background: var(--wash); }
  .note svg { width: 14px; height: 14px; flex: none; margin-top: 3px; }
  .actions-row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-top: 16px; }
  .inline-msg { font-size: 13.5px; color: var(--ink-2); }
  .inline-msg.error { color: var(--critical); }

  /* ---- medicines and contacts as rows that open ---- */
  .items { display: grid; gap: 10px; }
  .item { border: 1px solid var(--line); border-radius: 12px; }
  .item.has-error { border-color: var(--critical); }
  .item-head { display: flex; align-items: center; gap: 12px; padding: 12px 14px; cursor: pointer; }
  .item-head .who { flex: 1; min-width: 0; }
  .item-head .name { font-weight: 650; }
  .item-head .name .dose { font-weight: 450; color: var(--ink-2); }
  .item-head .details { font-size: 13px; color: var(--muted); display: flex; gap: 6px; flex-wrap: wrap; align-items: center; margin-top: 2px; }
  .time-chip { font-size: 12.5px; font-weight: 600; padding: 1px 8px; border-radius: 999px; background: var(--brand-soft); color: var(--brand); }
  .low { color: var(--warning-ink); font-weight: 650; }
  .chev { width: 18px; height: 18px; color: var(--muted); transition: transform .2s; flex: none; }
  .item.open .chev { transform: rotate(180deg); }
  .item-body { padding: 4px 14px 16px; border-top: 1px solid var(--line); display: none; }
  .item.open .item-body { display: block; padding-top: 14px; }
  .item-foot { display: flex; justify-content: flex-end; margin-top: 12px; }
  .times { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .time { display: inline-flex; align-items: center; gap: 2px; border: 1px solid var(--line); border-radius: 9px; background: var(--bg); padding-right: 2px; }
  .time input { border: none; background: none; width: 120px; padding: 7px 8px; }
  .time button { border: none; background: none; color: var(--muted); cursor: pointer; padding: 4px 6px; border-radius: 6px; font-size: 16px; line-height: 1; }
  .time button:hover { color: var(--critical); background: var(--wash); }
  .empty { color: var(--muted); font-size: 14px; margin: 0; padding: 14px; text-align: center; border: 1px dashed var(--line); border-radius: 12px; }

  /* ---- save bar: only when something changed ---- */
  .savebar {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; background: var(--panel); border-top: 1px solid var(--line);
    padding: 12px 20px; display: flex; gap: 10px; align-items: center; justify-content: flex-end;
    transform: translateY(110%); transition: transform .2s; box-shadow: 0 -6px 20px rgba(16,24,22,.08);
  }
  .savebar.show { transform: none; }
  .savebar .msg { flex: 1; font-size: 14px; color: var(--ink-2); }
  .savebar .msg.error { color: var(--critical); font-weight: 600; }
  .toast {
    position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: var(--ink); color: var(--panel); z-index: 7;
    padding: 10px 16px; border-radius: 10px; font-size: 14px; opacity: 0; transition: opacity .2s; pointer-events: none;
    display: flex; gap: 12px; align-items: center;
  }
  .toast.show { opacity: 1; pointer-events: auto; }
  .toast button { background: none; border: none; color: var(--brand-soft); font-weight: 700; cursor: pointer; padding: 0; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

  @media (max-width: 900px) {
    header { padding: 10px 16px; }
    header .label { display: none; }
    .layout { grid-template-columns: 1fr; padding: 0 16px 120px; gap: 12px; }
    nav.sections {
      position: sticky; top: 57px; z-index: 4; display: flex; overflow-x: auto; gap: 6px; margin: 0 -16px; padding: 10px 16px;
      background: var(--bg); border-bottom: 1px solid var(--line); scrollbar-width: none;
    }
    nav.sections a { flex: none; padding: 6px 12px; border: 1px solid var(--line); background: var(--panel); border-radius: 999px; font-size: 13px; }
    nav.sections .state { display: none; }
    html { scroll-padding-top: 120px; }
    .card { padding: 16px; }
    .grid, .grid.three { grid-template-columns: 1fr; }
    .savebar { padding: 10px 16px; }
    .savebar .msg { font-size: 13px; }
  }

  /* ================= spatial layer =================
     Frosted-glass panels float over a slowly drifting colour backdrop (the same design as the dashboard). */
  html { background: var(--base); }
  body { background: transparent; font-family: -apple-system, "SF Pro Text", system-ui, "Segoe UI", Roboto, sans-serif; -webkit-font-smoothing: antialiased; }
  .backdrop { position: fixed; inset: 0; z-index: -1; overflow: hidden; pointer-events: none; }
  .backdrop i { position: absolute; width: 58vmax; height: 58vmax; border-radius: 50%; filter: blur(90px); opacity: .75; }
  .backdrop i:nth-child(1) { background: var(--blob-1); top: -22vmax; left: -14vmax; animation: drift1 38s ease-in-out infinite alternate; }
  .backdrop i:nth-child(2) { background: var(--blob-2); top: -10vmax; right: -20vmax; animation: drift2 44s ease-in-out infinite alternate; }
  .backdrop i:nth-child(3) { background: var(--blob-3); bottom: -26vmax; left: 18vmax; animation: drift3 50s ease-in-out infinite alternate; }
  .backdrop i:nth-child(4) { background: var(--blob-4); bottom: -30vmax; right: -12vmax; opacity: .45; animation: drift1 56s ease-in-out infinite alternate-reverse; }
  @keyframes drift1 { to { transform: translate(8vmax, 6vmax) scale(1.08); } }
  @keyframes drift2 { to { transform: translate(-10vmax, 8vmax) scale(.94); } }
  @keyframes drift3 { to { transform: translate(6vmax, -8vmax) scale(1.1); } }

  .card, .ornament, .glass {
    background: var(--glass); -webkit-backdrop-filter: var(--blur); backdrop-filter: var(--blur); box-shadow: var(--depth); border: none;
  }
  @supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) {
    .card, .ornament, .glass { background: var(--glass-strong); }
  }
  @media (prefers-reduced-transparency: reduce) {
    .card, .ornament, .glass { background: var(--glass-strong); -webkit-backdrop-filter: none; backdrop-filter: none; }
    .backdrop i { opacity: .25; }
  }
  .ornament { background: var(--glass-strong); }  /* toolbars stay legible over content scrolling under them */
  .card { border-radius: 26px; position: relative; isolation: isolate; transition: box-shadow .35s, transform .35s cubic-bezier(.2,.8,.2,1); }
  .card::before { /* a glow that follows the pointer, like gaze on Vision Pro */
    content: ""; position: absolute; inset: 0; border-radius: inherit; z-index: -1; opacity: 0; transition: opacity .3s; pointer-events: none;
    background: radial-gradient(420px circle at var(--mx, 50%) var(--my, 50%), var(--glow), transparent 60%);
  }
  .card:hover { box-shadow: var(--depth-hover); }
  .card:hover::before { opacity: 1; }

  /* floating toolbar */
  header { position: sticky; top: 14px; z-index: 10; display: block; max-width: var(--page, 1180px); margin: 14px auto 0; padding: 0 20px; background: none; border: none; }
  .ornament { display: flex; align-items: center; gap: 10px; padding: 8px 8px 8px 14px; border-radius: 999px; }
  .logo { width: 34px; height: 34px; border-radius: 50%; flex: none; display: grid; place-items: center; color: #fff;
    background: linear-gradient(140deg, #2dd4bf, #2a78d6); box-shadow: 0 1px 0 rgba(255,255,255,.5) inset, 0 6px 14px -4px rgba(42,120,214,.6); }
  .logo svg { width: 18px; height: 18px; }
  header h1 { letter-spacing: -.01em; }

  /* capsule buttons that brighten under the pointer */
  .btn { border: none; border-radius: 999px; background: var(--well); box-shadow: 0 0 0 1px var(--well-edge) inset; color: var(--ink);
    transition: background .2s, transform .2s, box-shadow .2s; }
  .btn:hover:not(:disabled) { background: var(--glass-strong); box-shadow: 0 0 0 1px var(--glass-edge) inset, 0 6px 16px -6px rgba(0,0,0,.25); transform: translateY(-1px); }
  .btn:active:not(:disabled) { transform: scale(.97); }
  .btn.primary { background: var(--brand); color: var(--brand-ink); box-shadow: 0 1px 0 rgba(255,255,255,.35) inset, 0 8px 18px -8px var(--brand); }
  .btn.primary:hover:not(:disabled) { background: color-mix(in srgb, var(--brand) 88%, #fff); }

  /* recessed fields */
  input:not([type="checkbox"]) { border: none; border-radius: 12px; background: var(--well);
    box-shadow: 0 0 0 1px var(--well-edge) inset, 0 1px 2px rgba(0,0,0,.06) inset; transition: box-shadow .2s, background .2s; }
  input:not([type="checkbox"]):hover { box-shadow: 0 0 0 1px color-mix(in srgb, var(--brand) 35%, transparent) inset; }
  input:not([type="checkbox"]):focus { outline: none; background: var(--glass-strong); box-shadow: 0 0 0 2px var(--brand) inset, 0 0 0 5px var(--brand-soft); }

  .toast { background: var(--glass-strong); color: var(--ink); -webkit-backdrop-filter: var(--blur); backdrop-filter: var(--blur);
    box-shadow: var(--depth); border-radius: 999px; font-weight: 550; }

  @media (prefers-reduced-motion: reduce) {
    .backdrop i { animation: none !important; }
    .card, .btn, .btn:hover:not(:disabled) { transition: none; transform: none; }
  }
  @media (max-width: 900px) {
    header { top: 10px; margin-top: 10px; padding: 0 16px; }
    .ornament { padding: 6px 6px 6px 10px; gap: 8px; border-radius: 22px; }
    .logo { width: 30px; height: 30px; }
    .card { border-radius: 22px; }
  }

  :root { --page: 1100px; }
  html { scroll-padding-top: 96px; }
  .layout { padding-top: 22px; }
  nav.sections { top: 92px; padding: 8px; border-radius: 22px; background: var(--glass); -webkit-backdrop-filter: var(--blur); backdrop-filter: var(--blur); box-shadow: var(--depth); }
  nav.sections a { border-radius: 14px; transition: background .2s; }
  nav.sections a:hover { background: var(--well); }
  nav.sections a[aria-current="true"] { background: var(--glass-strong); color: var(--brand); box-shadow: 0 1px 0 var(--glass-edge) inset, 0 4px 12px -4px rgba(0,0,0,.18); }
  .dot.good { box-shadow: 0 0 0 3px color-mix(in srgb, var(--good) 20%, transparent); }
  .dot.warn { box-shadow: 0 0 0 3px color-mix(in srgb, var(--warning) 25%, transparent); }
  .dot.bad { box-shadow: 0 0 0 3px color-mix(in srgb, var(--critical) 22%, transparent); }
  .progress-card .bar-track { height: 10px; background: var(--well); box-shadow: 0 1px 2px rgba(0,0,0,.08) inset; }
  .progress-card .bar-track span { background: linear-gradient(90deg, #2dd4bf, var(--good)); box-shadow: 0 0 12px -2px var(--good); }
  .item { border: none; border-radius: 18px; background: var(--wash); box-shadow: 0 0 0 1px var(--well-edge) inset; transition: background .2s, box-shadow .2s; }
  .item:hover { background: var(--glass-strong); }
  .item.open { background: var(--glass-strong); box-shadow: 0 1px 0 var(--glass-edge) inset, 0 12px 28px -14px rgba(0,0,0,.3); }
  .item.has-error { box-shadow: 0 0 0 1.5px var(--critical) inset; }
  .item-body { border-top-color: var(--line); }
  .time { border: none; border-radius: 12px; background: var(--well); box-shadow: 0 0 0 1px var(--well-edge) inset; }
  .time input, .time input:hover, .time input:focus { background: none; box-shadow: none; }
  .time:focus-within { box-shadow: 0 0 0 2px var(--brand) inset, 0 0 0 5px var(--brand-soft); }
  .preset { border: none; background: var(--well); box-shadow: 0 0 0 1px var(--well-edge) inset; transition: background .2s; }
  .preset:hover { background: var(--glass-strong); }
  .preset[aria-pressed="true"] { background: var(--brand-soft); box-shadow: 0 0 0 1.5px var(--brand) inset; }
  .note { border-radius: 14px; background: var(--well); }
  .optional { background: var(--well); }
  .empty { border-radius: 18px; }
  input:not([type="checkbox"])[aria-invalid="true"], input:not([type="checkbox"])[aria-invalid="true"]:focus {
    background: var(--critical-soft); box-shadow: 0 0 0 1.5px var(--critical) inset; }
  input:not([type="checkbox"])[aria-invalid="true"]:focus { box-shadow: 0 0 0 2px var(--critical) inset, 0 0 0 5px var(--critical-soft); }
  .layout { grid-template-columns: 240px 1fr; }
  /* scan results and interaction findings */
  .panel { margin: 0 0 14px; padding: 14px 16px; border-radius: 18px; background: var(--well); box-shadow: 0 0 0 1px var(--well-edge) inset; font-size: 14px; }
  .panel.busy { color: var(--ink-2); }
  .panel h3 { margin: 0 0 6px; font-size: 14.5px; }
  .panel p { margin: 4px 0; color: var(--ink-2); }
  .findings { list-style: none; margin: 8px 0 0; padding: 0; display: grid; gap: 8px; }
  .findings li { padding: 10px 12px; border-radius: 14px; background: var(--glass-strong); box-shadow: 0 0 0 1px var(--well-edge) inset; }
  .sev { font-size: 11.5px; font-weight: 700; padding: 1px 8px; border-radius: 999px; margin-right: 6px; text-transform: uppercase; letter-spacing: .03em; }
  .sev.serious { background: var(--critical-soft); color: var(--critical); }
  .sev.moderate { background: color-mix(in srgb, var(--warning) 22%, transparent); color: var(--warning-ink); }
  .sev.minor { background: var(--well); color: var(--ink-2); }
  .spin { display: inline-block; width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--line); border-top-color: var(--brand);
    animation: spin .8s linear infinite; vertical-align: -2px; margin-right: 8px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  /* the save bar floats up as a glass capsule */
  .savebar { left: 16px; right: 16px; bottom: 16px; max-width: 760px; margin: 0 auto; border: none; border-radius: 999px; padding: 10px 10px 10px 22px;
    background: var(--glass-strong); -webkit-backdrop-filter: var(--blur); backdrop-filter: var(--blur);
    box-shadow: var(--depth), 0 24px 60px -16px rgba(0,0,0,.35); transform: translateY(calc(100% + 32px)); transition: transform .35s cubic-bezier(.2,.8,.2,1); }
  .savebar.show { transform: none; }
  .toast { bottom: 96px; }
  .toast button { color: var(--brand); }
  @media (max-width: 900px) {
    html { scroll-padding-top: 150px; }
    .layout { padding-top: 12px; grid-template-columns: 1fr; }
    nav.sections { top: 76px; background: var(--glass-strong); margin: 0; padding: 6px; border-radius: 999px; border: none; }
    nav.sections a { border: none; background: none; border-radius: 999px; }
    .savebar { border-radius: 22px; padding: 10px 10px 10px 16px; }
  }
</style>
</head>
<body>
<div class="backdrop" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
<header>
 <div class="ornament">
  <div class="logo" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 11c0 5.6-7 10-7 10Z"/></svg></div>
  <h1>Kinvesper <span>· settings</span></h1>
  <div class="spacer"></div>
  <a class="btn" id="back" href="/dashboard" title="Back to the dashboard">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg>
    <span class="label">Dashboard</span>
  </a>
 </div>
</header>
<div class="layout">
  <nav class="sections" id="nav" aria-label="Settings sections"></nav>
  <main id="main"><p class="empty">Loading…</p></main>
</div>
<div class="savebar" id="savebar" role="region" aria-label="Unsaved changes">
  <span class="msg" id="msg" role="status" aria-live="polite"></span>
  <button class="btn quiet" id="discard" type="button">Discard</button>
  <button class="btn primary" id="save" type="button">Save changes</button>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<input type="file" id="photo" accept="image/*" hidden>
<script>
(() => {
  const key = new URLSearchParams(location.search).get("key") || "";
  const headers = key ? { "X-Dashboard-Key": key, "Content-Type": "application/json" } : { "Content-Type": "application/json" };
  if (key) document.getElementById("back").href = `/dashboard?key=${encodeURIComponent(key)}`;
  const $ = (id) => document.getElementById(id);
  const ICONS = {
    good: '<circle cx="7" cy="7" r="6" fill="var(--good)"/><path d="M4 7.2l2 2 4-4.2" fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>',
    warning: '<path d="M7 1l6.3 11H.7z" fill="var(--warning)"/><path d="M7 5v3.2M7 10.2h.01" stroke="#1a1a19" stroke-width="1.6" stroke-linecap="round"/>',
    muted: '<circle cx="7" cy="7" r="5.2" fill="none" stroke="var(--muted)" stroke-width="1.6"/>',
  };
  const EMAIL = {
    confirmed: ["good", "Confirmed: alerts are emailed here."],
    pending: ["warning", "Waiting for confirmation: open the email from “AWS Notifications” and click Confirm subscription."],
    not_subscribed: ["muted", "Save to send the confirmation email."],
    no_topic: ["muted", "Running locally: alerts are logged, not emailed."],
    unknown: ["muted", "Couldn't check the email status right now."],
  };
  const CHEVRON = '<svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>';
  const EMERGENCY = [["112", "India, EU"], ["911", "US, Canada"], ["999", "UK"], ["000", "Australia"]];
  const CONTACT_PRESETS = [["Bank", "bank"], ["Doctor", "doctor"], ["Pharmacy", "pharmacy"], ["Grandchild", "grandson"], ["Neighbour", "neighbour"]];

  let state = null, saved = "", errors = {}, open = new Set(), current = "person";
  const clone = (x) => JSON.parse(JSON.stringify(x));
  const snapshot = () => JSON.stringify({ p: state.profile, m: state.medications, c: state.contacts });

  function h(tag, attrs = {}, ...kids) {
    const el = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs)) {
      if (k === "class") el.className = v;
      else if (k === "html") el.innerHTML = v;
      else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
      else if (v !== undefined && v !== null && v !== false) el.setAttribute(k, v);
    }
    for (const kid of kids.flat()) if (kid !== null && kid !== undefined && kid !== false) el.append(kid);
    return el;
  }
  function whatsappNote(number) {
    const pretty = number.replace(/^\+1(\d{3})(\d{3})(\d{4})$/, "+1 $1 $2 $3");
    return note("good", `Alerts also arrive on WhatsApp from ${pretty}. On the Twilio sandbox, first send that number the sandbox's "join …" code from this phone. Reply OK to mark an alert handled, STATUS for today, or anything else to have it read out on the Echo.`);
  }

  function note(tone, text) {
    return h("div", { class: "note" }, h("span", { html: `<svg viewBox="0 0 14 14" aria-hidden="true">${ICONS[tone]}</svg>` }), text);
  }
  function toast(text, action) {
    const t = $("toast");
    t.replaceChildren(h("span", {}, text));
    if (action) t.append(h("button", { type: "button", onclick: () => { action[1](); t.classList.remove("show"); } }, action[0]));
    t.classList.add("show");
    clearTimeout(toast.timer);
    toast.timer = setTimeout(() => t.classList.remove("show"), action ? 6000 : 2600);
  }
  const say = (text, error = false) => { $("msg").textContent = text; $("msg").className = error ? "msg error" : "msg"; };

  // ---- changes, saving, discarding ----
  function changed() {
    const dirty = state && snapshot() !== saved;
    $("savebar").classList.toggle("show", dirty);
    if (dirty && !$("msg").classList.contains("error")) say("You have unsaved changes");
    renderNav();
    return dirty;
  }

  // ---- checks, the same rules the server applies, shown next to each field ----
  const clean = (phone) => (phone || "").replace(/[\s\-().]/g, "");
  const PHONE = /^\+[1-9]\d{7,14}$/, EMAIL_RE = /^[^@\s]+@[^@\s]+\.[^@\s]+$/, TIME = /^([01]\d|2[0-3]):[0-5]\d$/;
  function validate() {
    const e = {}, p = state.profile;
    for (const [k, label] of [["patient_name", "Full name"], ["preferred_name", "What to call them"], ["caregiver_name", "The caregiver's name"]])
      if (!(p[k] || "").trim()) e[`p.${k}`] = `${label} is needed.`;
    if (!/^\d{2,6}$/.test(p.emergency_number || "")) e["p.emergency_number"] = "Use the short local number, like 112 or 911.";
    if (p.checkin_time && !TIME.test(p.checkin_time)) e["p.checkin_time"] = "Pick a time, or turn the check-in off.";
    for (const who of ["caregiver", "backup"]) {
      if (p[`${who}_phone`] && !PHONE.test(clean(p[`${who}_phone`]))) e[`p.${who}_phone`] = "Start with + and the country code, like +91 98765 43210.";
      if (p[`${who}_email`] && !EMAIL_RE.test(p[`${who}_email`].trim())) e[`p.${who}_email`] = "That email address doesn't look right.";
    }
    if (!clean(p.caregiver_phone) && !(p.caregiver_email || "").trim()) e["p.caregiver_email"] = "Add a phone or an email, so alerts reach someone.";
    if ((p.backup_phone || p.backup_email) && !(p.backup_name || "").trim()) e["p.backup_name"] = "Add the backup contact's name.";
    if (!state.medications.length) e.meds = "Add at least one medicine.";
    state.medications.forEach((m, i) => {
      if (!(m.name || "").trim()) e[`m.${i}.name`] = "Add the medicine's name.";
      if (!(m.dose || "").trim()) e[`m.${i}.dose`] = "Add the dose, like 10 mg.";
      if (!m.times.length || !m.times.every((t) => TIME.test(t))) e[`m.${i}.times`] = "Add at least one time.";
      if (!/^\d+$/.test(String(m.pills_remaining ?? ""))) e[`m.${i}.pills_remaining`] = "A whole number.";
    });
    state.contacts.forEach((c, i) => {
      if (!(c.name || "").trim()) e[`c.${i}.name`] = "Add a name.";
      if (!/^\+?\d{7,15}$/.test(clean(c.phone))) e[`c.${i}.phone`] = "Digits, with the country code if it has one.";
    });
    return e;
  }

  // ---- building blocks ----
  let uid = 0;
  function field(label, obj, prop, opts = {}) {
    const id = `f${++uid}`, errKey = opts.err, err = errKey && errors[errKey];
    const input = h("input", {
      id, type: opts.type || "text", value: obj[prop] ?? "", placeholder: opts.placeholder || "",
      autocomplete: opts.autocomplete || "off", inputmode: opts.inputmode, "aria-invalid": err ? "true" : null,
      "aria-describedby": err || opts.hint ? `${id}-d` : null, "data-err": errKey || null,
      oninput: (e) => { obj[prop] = opts.type === "number" ? e.target.value.replace(/\D/g, "") : e.target.value; if (opts.onchange) opts.onchange(); changed(); },
      onblur: (e) => {  // a fixed field loses its error at once, without redrawing (keeps the focus where it went)
        if (!errKey || !errors[errKey] || validate()[errKey]) return;
        delete errors[errKey];
        e.target.removeAttribute("aria-invalid");
        e.target.parentElement.querySelector(".error-text")?.remove();
        if (!Object.keys(errors).length) say("You have unsaved changes");
      },
    });
    return h("div", { class: `field${opts.wide ? " wide" : ""}` },
      h("label", { for: id }, label, opts.required ? h("span", { class: "req", "aria-hidden": "true" }, "*") : null),
      input, opts.extra || null,
      err ? h("span", { class: "error-text", id: `${id}-d` }, err) : opts.hint ? h("span", { class: "hint", id: `${id}-d` }, opts.hint) : null);
  }

  function section(id, title, sub, body, { optional, action } = {}) {
    return h("section", { class: "card", id, "aria-labelledby": `${id}-t` },
      h("div", { class: "card-head" },
        h("div", { class: "grow" }, h("h2", { id: `${id}-t` }, title, optional ? h("span", { class: "optional" }, "Optional") : null), h("p", { class: "sub" }, sub)),
        action || null),
      ...body);
  }

  const clock12 = (t) => new Date(`2000-01-01T${t}:00`).toLocaleTimeString(undefined, { hour: "numeric", minute: "2-digit" });

  function timesEditor(m, i) {
    const err = errors[`m.${i}.times`];
    const row = h("div", { class: "times", "data-err": `m.${i}.times` },
      ...m.times.map((t, j) => h("span", { class: "time" },
        h("input", { type: "time", value: t, "aria-label": `Dose time ${j + 1}`, oninput: (e) => { m.times[j] = e.target.value; changed(); } }),
        h("button", { type: "button", "aria-label": `Remove ${t}`, onclick: () => { m.times.splice(j, 1); changed(); render(); } }, "×"))),
      h("button", { class: "btn small", type: "button", onclick: () => { m.times.push(["08:00", "13:00", "20:00", "22:00", "06:00"].find((t) => !m.times.includes(t)) || "12:00"); changed(); render(); } }, "+ Add a time"));
    return h("div", { class: "field wide" }, h("label", {}, "Times each day", h("span", { class: "req", "aria-hidden": "true" }, "*")), row,
      err ? h("span", { class: "error-text" }, err) : h("span", { class: "hint" }, "Kinvesper and the Echo remind at these times."));
  }

  function medicine(m, i) {
    const low = Number(m.pills_remaining) <= state.low_stock_threshold;
    const hasErr = Object.keys(errors).some((k) => k.startsWith(`m.${i}.`));
    const isOpen = open.has(`m${i}`) || hasErr;
    const toggle = () => { open.has(`m${i}`) ? open.delete(`m${i}`) : open.add(`m${i}`); render(); };
    return h("div", { class: `item${isOpen ? " open" : ""}${hasErr ? " has-error" : ""}` },
      h("div", { class: "item-head", role: "button", tabindex: "0", "aria-expanded": String(isOpen), onclick: toggle,
                 onkeydown: (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); toggle(); } } },
        h("div", { class: "who" },
          h("div", { class: "name" }, m.name || "New medicine", m.dose ? h("span", { class: "dose" }, ` ${m.dose}`) : null),
          h("div", { class: "details" },
            ...m.times.filter((t) => TIME.test(t)).map((t) => h("span", { class: "time-chip" }, clock12(t))),
            h("span", { class: low ? "low" : "" }, `${m.pills_remaining || 0} pills left${low ? " · running low" : ""}`),
            m.purpose ? h("span", {}, `For ${m.purpose}`) : null)),
        h("span", { html: CHEVRON })),
      h("div", { class: "item-body" },
        h("div", { class: "grid" },
          field("Name", m, "name", { required: true, err: `m.${i}.name`, placeholder: "Metformin" }),
          field("Dose", m, "dose", { required: true, err: `m.${i}.dose`, placeholder: "500 mg" }),
          timesEditor(m, i),
          field("Pills left", m, "pills_remaining", { type: "number", inputmode: "numeric", err: `m.${i}.pills_remaining`,
            hint: `Kinvesper offers a refill at ${state.low_stock_threshold} or fewer.` }),
          field("What it's for", m, "purpose", { placeholder: "blood pressure", hint: "So “my blood pressure pill” finds it." }),
          field("Instructions", m, "instructions", { placeholder: "take with food", wide: true, hint: "Said with every reminder." })),
        h("div", { class: "item-foot" },
          h("button", { class: "btn quiet danger", type: "button", onclick: () => remove("medications", i, m.name || "the medicine") }, "Remove medicine"))));
  }

  function contact(c, i) {
    return h("div", { class: `item open${Object.keys(errors).some((k) => k.startsWith(`c.${i}.`)) ? " has-error" : ""}` },
      h("div", { class: "item-body", style: "display:block;border:none;padding:14px" },
        h("div", { class: "grid three" },
          field("Name", c, "name", { err: `c.${i}.name`, placeholder: "State Bank of India" }),
          field("Who they are", c, "relation", { placeholder: "bank, doctor, grandson" }),
          field("Phone", c, "phone", { type: "tel", err: `c.${i}.phone`, placeholder: "+91 1800 123 4567" })),
        h("div", { class: "item-foot" },
          h("button", { class: "btn quiet danger", type: "button", onclick: () => remove("contacts", i, c.name || "the contact") }, "Remove"))));
  }

  function remove(list, i, label) {
    const item = state[list].splice(i, 1)[0];
    open.clear(); errors = {};
    changed(); render();
    toast(`Removed ${label}`, ["Undo", () => { state[list].splice(i, 0, item); changed(); render(); }]);
  }

  // ---- how complete the setup is ----
  function status() {
    const p = state.profile;
    const contactSet = PHONE.test(clean(p.caregiver_phone)) || EMAIL_RE.test((p.caregiver_email || "").trim());
    return {
      person: p.patient_name && p.preferred_name ? ["good", "Done"] : ["bad", "Needed"],
      caregiver: !contactSet ? ["bad", "No contact"] : state.email_status === "pending" ? ["warn", "Confirm email"] : ["good", "Done"],
      backup: p.backup_name ? ["good", "Done"] : ["", "Optional"],
      contacts: state.contacts.length ? ["good", `${state.contacts.length}`] : ["warn", "None yet"],
      medicines: state.medications.length ? ["good", `${state.medications.length}`] : ["bad", "None"],
    };
  }
  const SECTIONS = [["person", "The person"], ["caregiver", "Caregiver"], ["backup", "Backup contact"], ["contacts", "Trusted contacts"], ["medicines", "Medicines"]];

  function renderNav() {
    if (!state) return;
    const st = status();
    $("nav").replaceChildren(...SECTIONS.map(([id, label]) => h("a", { href: `#${id}`, "aria-current": String(current === id) },
      h("span", { class: `dot ${st[id][0]}` }), label, h("span", { class: "state" }, st[id][1]))));
  }

  function setupCard() {
    const st = status(), p = state.profile;
    const todo = [
      st.caregiver[0] === "bad" && ["caregiver", `Add ${p.caregiver_name || "the caregiver"}'s phone or email, so alerts reach someone`],
      st.caregiver[1] === "Confirm email" && ["caregiver", "Confirm the alert email: click the link Amazon sent to it"],
      st.contacts[0] !== "good" && ["contacts", "Add trusted numbers (bank, doctor), so impostors are caught"],
      st.backup[0] !== "good" && ["backup", "Add a backup contact for urgent alerts nobody answers"],
    ].filter(Boolean);
    const done = SECTIONS.filter(([id]) => st[id][0] === "good").length;
    if (!todo.length) return null;
    return h("section", { class: "card" },
      h("div", { class: "progress-card" },
        h("strong", {}, `Setup: ${done} of ${SECTIONS.length} done`),
        h("div", { class: "bar-track", role: "img", "aria-label": `${done} of ${SECTIONS.length} sections done` }, h("span", { style: `width:${(100 * done) / SECTIONS.length}%` }))),
      h("ul", { class: "todo" }, todo.map(([id, text]) => h("li", {}, h("span", { class: `dot ${id === "caregiver" ? "bad" : "warn"}` }), h("a", { href: `#${id}` }, text)))));
  }

  // ---- prescription photos and interaction checks ----
  const scan = { busy: false, notes: "", added: 0, error: "", known: [], asNeeded: [] };
  const base = (name) => (name || "").toLowerCase().split(/\s+(?=\d)/)[0].replace(/[^a-z0-9\- ]/g, "").trim();
  function addMedicine(m, times) {
    state.medications.push({ name: m.name, dose: m.dose, times, pills_remaining: m.pills_remaining || 30, purpose: m.purpose, instructions: m.instructions });
    open.add(`m${state.medications.length - 1}`);
  }
  let findings = null;  // {busy, title, result}

  function interactionList(result) {
    return h("ul", { class: "findings" }, result.interactions.map((i) => h("li", {},
      h("span", { class: `sev ${i.severity}` }, i.severity), h("strong", {}, i.medicines.join(" + ")), h("p", {}, i.explanation))));
  }
  function scanPanel() {
    if (scan.busy) return h("div", { class: "panel busy", role: "status" }, h("span", { class: "spin" }), "Reading the photo…");
    if (scan.error) return h("div", { class: "panel", role: "alert" }, h("p", { class: "error-text" }, scan.error));
    if (!scan.added && !scan.notes && !scan.known.length && !scan.asNeeded.length) return null;
    const title = scan.added ? `Added ${scan.added} medicine${scan.added > 1 ? "s" : ""} from the photo. Check the details, then save.`
      : scan.known.length || scan.asNeeded.length ? "Nothing new to add from the photo." : "No medicines found in the photo.";
    return h("div", { class: "panel", role: "status" },
      h("h3", {}, title),
      scan.notes ? h("p", {}, scan.notes) : null,
      scan.known.length ? h("p", {}, `Already on the list: ${scan.known.join(", ")}.`) : null,
      ...scan.asNeeded.map((m) => h("p", {}, `${m.name} ${m.dose} is taken only when needed, so it has no reminder times. `,
        h("button", { class: "btn small", type: "button", onclick: () => {
          addMedicine(m, ["08:00"]);
          scan.asNeeded = scan.asNeeded.filter((x) => x !== m); scan.added += 1;
          changed(); render(); focusLast("#medicines .item.open input");
        } }, "Add it with a daily time"))));
  }
  function findingsPanel() {
    if (!findings) return null;
    if (findings.busy) return h("div", { class: "panel busy", role: "status" }, h("span", { class: "spin" }), `Checking ${findings.title} against the FDA's medicine labels…`);
    const r = findings.result;
    if (!r.interactions.length)
      return h("div", { class: "panel", role: "status" }, h("h3", {}, `No interactions found for ${findings.title}`),
        h("p", {}, "The FDA labels don't mention a problem with the other medicines. It's still worth asking the pharmacist."),
        r.not_found.length ? h("p", {}, `Not in the FDA labels: ${r.not_found.join(", ")}.`) : null);
    return h("div", { class: "panel", role: "alert" },
      h("h3", {}, `Check with the pharmacist or doctor: ${r.interactions.length} possible interaction${r.interactions.length > 1 ? "s" : ""}`),
      h("p", {}, "From the FDA's drug labels. It's also on the dashboard."), interactionList(r));
  }
  async function checkMedicines(names) {
    findings = { busy: true, title: names.join(", ") };
    render();
    try {
      findings = { title: names.join(", "), result: await call("POST", "/api/medications/interactions", { medicines: names }) };
    } catch (e) {
      findings = null;
      toast(`Couldn't check interactions: ${e.message}`);
    }
    render();
  }

  async function shrink(file) {  // phone photos are huge: 1600 px is plenty to read a label, and uploads fast
    try {
      const img = await createImageBitmap(file);
      const scale = Math.min(1, 1600 / Math.max(img.width, img.height));
      const c = Object.assign(document.createElement("canvas"), { width: Math.round(img.width * scale), height: Math.round(img.height * scale) });
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      return await new Promise((done) => c.toBlob(done, "image/jpeg", 0.85));
    } catch {
      return file;  // the browser can't decode it: let the server say what's wrong
    }
  }
  async function scanPhoto(file) {
    if (!file) return;
    Object.assign(scan, { busy: true, error: "", notes: "", added: 0 });
    render();
    document.getElementById("medicines").scrollIntoView({ behavior: "smooth", block: "start" });
    try {
      const photo = await shrink(file);
      const r = await fetch("/api/medications/scan", { method: "POST", body: photo,
        headers: { ...(key ? { "X-Dashboard-Key": key } : {}), "Content-Type": photo.type || file.type || "image/jpeg" } });
      const data = await r.json().catch(() => ({}));
      if (!r.ok) throw new Error(data.error || r.statusText);
      const have = new Set(state.medications.map((m) => base(m.name)));
      const known = [], asNeeded = [];
      let added = 0;
      for (const m of data.medicines) {
        if (have.has(base(m.name))) known.push(m.name);       // scanned twice, or already set up
        else if (!m.times.length) asNeeded.push(m);           // "as needed": no daily reminder unless they want one
        else { addMedicine(m, m.times); have.add(base(m.name)); added += 1; }
      }
      Object.assign(scan, { busy: false, added, known, asNeeded, notes: data.notes || "" });
      findings = data.interactions && data.interactions.interactions.length ? { title: data.medicines.map((m) => m.name).join(", "), result: data.interactions } : null;
      changed();
    } catch (e) {
      Object.assign(scan, { busy: false, error: e.message });
    }
    render();
  }

  function render() {
    const p = state.profile;
    uid = 0;
    const [tone, text] = EMAIL[state.email_status] || EMAIL.unknown;
    const [btone, btext] = EMAIL[state.backup_email_status] || EMAIL.unknown;
    const emergency = h("div", { class: "presets", role: "group", "aria-label": "Common emergency numbers" },
      ...EMERGENCY.map(([n, where]) => h("button", { class: "preset", type: "button", "aria-pressed": String(p.emergency_number === n), title: where,
        onclick: () => { p.emergency_number = n; changed(); render(); } }, `${n} · ${where}`)));
    const scrollY = window.scrollY;
    $("main").replaceChildren(...[
      setupCard(),
      section("person", "The person", "Who Kinvesper talks with, and what it calls them.", [
        h("div", { class: "grid" },
          field("Full name", p, "patient_name", { required: true, err: "p.patient_name", autocomplete: "name" }),
          field("What to call them", p, "preferred_name", { required: true, err: "p.preferred_name", placeholder: "first name or nickname" }),
          field("Pharmacy", p, "pharmacy_name", { placeholder: "where refills are ordered" }),
          field("Emergency number", p, "emergency_number", { required: true, inputmode: "numeric", err: "p.emergency_number",
            hint: "What Kinvesper tells them to call in an emergency.", extra: emergency }),
          field("Daily “I'm okay” check-in", p, "checkin_time", { type: "time", err: "p.checkin_time",
            hint: p.checkin_time
              ? `The Echo asks ${p.preferred_name || "them"} to say they're okay at ${clock12(p.checkin_time)}. If nothing's heard within ${state.checkin_grace_min} minutes, ${p.caregiver_name || "the caregiver"} gets a text.`
              : "Off. Turn it on so someone notices if a day goes by without a word.",
            extra: h("div", { class: "presets", role: "group", "aria-label": "Check-in" },
              ...[["09:00", "9 AM"], ["10:00", "10 AM"], ["11:00", "11 AM"], ["", "Off"]].map(([t, label]) => h("button", {
                class: "preset", type: "button", "aria-pressed": String((p.checkin_time || "") === t),
                onclick: () => { p.checkin_time = t; changed(); render(); } }, label))) }))]),
      section("caregiver", "Caregiver", "Suspicious calls, emergencies, missed doses and messages go to this phone and email.", [
        h("div", { class: "grid" },
          field("Name", p, "caregiver_name", { required: true, err: "p.caregiver_name" }),
          field("Relationship", p, "caregiver_relation", { placeholder: "daughter, son, nurse" }),
          field("Phone", p, "caregiver_phone", { type: "tel", err: "p.caregiver_phone", placeholder: "+91 98765 43210", hint: "With the country code. Gets texts.", autocomplete: "tel" }),
          field("Email", p, "caregiver_email", { type: "email", err: "p.caregiver_email", placeholder: "name@example.com", hint: "Gets alerts and the weekly report.", autocomplete: "email" })),
        p.caregiver_email && snapshot() === saved ? note(tone, text) : null,
        p.caregiver_phone ? note("muted", "Texts from a new AWS account only reach numbers verified in the SNS SMS sandbox; email always works.") : null,
        p.caregiver_phone ? (state.calls
          ? note("good", `Urgent alerts also ring this phone: right away for an emergency, and after a few minutes for anything urgent nobody has acknowledged.`)
          : note("muted", "Phone calls for urgent alerts aren't switched on for this server yet (it needs a calling number). Texts and email still go out."))
          : null,
        p.caregiver_phone && state.whatsapp ? whatsappNote(state.whatsapp) : null,
        h("div", { class: "actions-row" },
          h("button", { class: "btn", type: "button", onclick: (e) => run(e, "/api/settings/test-alert", "Sending…",
            (r) => r.called ? "Test alert sent, and your phone is ringing now. Press 1 on the call to try acknowledging."
              : r.sent ? "Test alert sent. Check the phone and inbox." : "Nothing was sent: there's no phone or email to send to here.") }, "Send a test alert"),
          h("button", { class: "btn", type: "button", onclick: (e) => run(e, "/api/reports/weekly", "Writing the report…",
            (r) => r.sent ? "Weekly report emailed." : "Report written, but not emailed: no email set up here.") }, "Send the weekly report now"),
          h("span", { class: "inline-msg", id: "caregiver-msg", role: "status", "aria-live": "polite" }))]),
      section("backup", "Backup contact", `If an urgent alert (a fall, chest pain, a likely scam) isn't acknowledged within ${state.escalate_after_min} minutes, it goes to this person too.`, [
        h("div", { class: "grid" },
          field("Name", p, "backup_name", { err: "p.backup_name", placeholder: "a neighbour or another relative", wide: true }),
          field("Phone", p, "backup_phone", { type: "tel", err: "p.backup_phone", placeholder: "+91 98765 43210", hint: "With the country code." }),
          field("Email", p, "backup_email", { type: "email", err: "p.backup_email", placeholder: "name@example.com" })),
        p.backup_email && snapshot() === saved ? note(btone, btext) : null], { optional: true }),
      section("contacts", "Trusted contacts", "Real numbers for the bank, the doctor and family. When a caller claims to be one of them from another number, Kinvesper tells them to hang up and reads out the real number.", [
        h("div", { class: "items" }, state.contacts.length ? state.contacts.map(contact) : h("p", { class: "empty" }, "No trusted contacts yet. Start with the bank: it's the one scammers pretend to be most.")),
        h("div", { class: "actions-row" }, h("span", { class: "hint" }, "Add:"),
          ...CONTACT_PRESETS.map(([label, relation]) => h("button", { class: "preset", type: "button",
            onclick: () => { state.contacts.push({ name: "", relation, phone: "" }); changed(); render(); focusLast("#contacts .item input"); } }, `+ ${label}`)),
          h("button", { class: "preset", type: "button", onclick: () => { state.contacts.push({ name: "", relation: "", phone: "" }); changed(); render(); focusLast("#contacts .item input"); } }, "+ Someone else"))]),
      section("medicines", "Medicines", "Kinvesper reminds, logs doses and orders refills from this list. Click one to edit it.", [
        errors.meds ? h("p", { class: "error-text" }, errors.meds) : null,
        scanPanel(), findingsPanel(),
        h("div", { class: "items" }, state.medications.length ? state.medications.map(medicine) : h("p", { class: "empty" }, "No medicines yet.")),
        h("div", { class: "actions-row" },
          state.scan ? h("button", { class: "btn primary", type: "button", onclick: () => $("photo").click(), disabled: scan.busy ? "" : null },
            h("span", { html: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>' }),
            "Scan a prescription") : null,
          h("button", { class: "btn", type: "button", onclick: () => {
            state.medications.push({ name: "", dose: "", times: ["08:00"], pills_remaining: 30, purpose: "", instructions: "" });
            open.add(`m${state.medications.length - 1}`); changed(); render(); focusLast("#medicines .item.open input");
          } }, "+ Add a medicine"),
          state.scan ? h("span", { class: "hint" }, "Photograph a prescription or pill box: Claude reads it, you check it.") : null)]),
    ].filter(Boolean));
    window.scrollTo({ top: scrollY });
    renderNav();
  }

  function focusLast(selector) {  // the first field of the item just added
    requestAnimationFrame(() => {
      const items = document.querySelectorAll(selector.replace(" input", ""));
      items[items.length - 1]?.querySelector("input")?.focus();
    });
  }

  async function call(method, url, body) {
    const r = await fetch(url, { method, headers, body: body ? JSON.stringify(body) : undefined });
    const data = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(data.error || r.statusText);
    return data;
  }

  async function run(e, url, pending, done) {
    const out = $("caregiver-msg");
    if (snapshot() !== saved) { out.textContent = "Save your changes first."; out.className = "inline-msg error"; return; }
    e.target.disabled = true; out.textContent = pending; out.className = "inline-msg";
    try {
      const r = await call("POST", url);
      if (r.email_status) Object.assign(state, { email_status: r.email_status, backup_email_status: r.backup_email_status });
      out.textContent = done(r);
      out.className = r.sent ? "inline-msg" : "inline-msg error";
    } catch (err) {
      out.textContent = err.message; out.className = "inline-msg error";
    } finally {
      e.target.disabled = false;
    }
  }

  async function saveAll() {
    errors = validate();
    if (Object.keys(errors).length) {
      const n = Object.keys(errors).length;
      say(`Please fix ${n === 1 ? "the highlighted field" : `the ${n} highlighted fields`}.`, true);
      render();
      const first = document.querySelector('[aria-invalid="true"], .has-error, .error-text');
      first && first.scrollIntoView({ block: "center" });
      document.querySelector('[aria-invalid="true"]')?.focus({ preventScroll: true });
      return;
    }
    $("save").disabled = true; say("Saving…");
    try {
      const body = { profile: { ...state.profile, caregiver_phone: clean(state.profile.caregiver_phone), backup_phone: clean(state.profile.backup_phone) },
        medications: state.medications.map((m) => ({ ...m, pills_remaining: Number(m.pills_remaining) })), contacts: state.contacts };
      state = await call("PUT", "/api/settings", body);
      saved = snapshot(); open.clear();
      Object.assign(scan, { added: 0, notes: "", error: "", known: [], asNeeded: [] });
      render(); changed();
      toast(state.email_status === "pending" ? "Saved. Ask the caregiver to confirm the alert email." : "Saved");
      if (state.added && state.added.length) checkMedicines(state.added);  // new medicines: check them against the rest
    } catch (e) {
      say(e.message, true);
    } finally {
      $("save").disabled = false;
    }
  }

  $("save").onclick = saveAll;
  $("photo").addEventListener("change", (e) => { scanPhoto(e.target.files[0]); e.target.value = ""; });
  function restore() {
    const s = JSON.parse(saved);
    state.profile = s.p; state.medications = s.m; state.contacts = s.c;
    errors = {}; open.clear(); render(); changed(); toast("Changes discarded");
  }
  $("discard").onclick = restore;
  addEventListener("keydown", (e) => { if ((e.ctrlKey || e.metaKey) && e.key === "s") { e.preventDefault(); if (snapshot() !== saved) saveAll(); } });
  addEventListener("beforeunload", (e) => { if (state && snapshot() !== saved) e.preventDefault(); });

  // Which section is on screen, for the nav: the last one whose top has passed the header.
  let ticking = false;
  addEventListener("scroll", () => {
    if (ticking) return;
    ticking = true;
    requestAnimationFrame(() => {
      ticking = false;
      const atBottom = innerHeight + scrollY >= document.documentElement.scrollHeight - 4;
      const line = matchMedia("(max-width: 900px)").matches ? 140 : 110;
      const id = atBottom ? SECTIONS[SECTIONS.length - 1][0]
        : SECTIONS.map(([id]) => id).filter((id) => $(id) && $(id).getBoundingClientRect().top <= line).pop() || "person";
      if (id !== current) { current = id; renderNav(); }
    });
  }, { passive: true });

  call("GET", "/api/settings")
    .then((d) => {
      state = d;
      state.contacts = state.contacts || [];
      state.medications.forEach((m) => { m.times = m.times || []; });
      saved = snapshot();
      render();
    })
    .catch((e) => $("main").replaceChildren(h("p", { class: "empty" }, `Couldn't load settings: ${e.message}`)));
})();
</script>
<script>
  // The glow on a glass panel follows the pointer, the way a Vision Pro panel lights up where you look.
  document.addEventListener("pointermove", (e) => {
    const c = e.target.closest && e.target.closest(".card");
    if (!c) return;
    const r = c.getBoundingClientRect();
    c.style.setProperty("--mx", `${e.clientX - r.left}px`);
    c.style.setProperty("--my", `${e.clientY - r.top}px`);
  }, { passive: true });
</script>
</body>
</html>
