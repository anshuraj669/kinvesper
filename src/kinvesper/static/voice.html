<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kinvesper Voice</title>
<style>
  :root {
    color-scheme: light;
    --base: #e9eef0; --ink: #0f1a19; --ink-2: #33423f; --muted: #556461;
    --panel: #f7fafa; --bg: rgba(15,30,28,.055); --wash: rgba(15,30,28,.055); --line: rgba(15,30,28,.11);
    --glass: rgba(255,255,255,.58); --glass-strong: rgba(255,255,255,.80); --glass-edge: rgba(255,255,255,.75);
    --well: rgba(15,30,28,.06); --well-edge: rgba(15,30,28,.08); --glow: rgba(255,255,255,.55);
    --blob-1: #7dd3c8; --blob-2: #93b8f5; --blob-3: #c9b6f2; --blob-4: #f7c9a8;
    --depth: 0 1px 0 var(--glass-edge) inset, 0 0 0 1px rgba(255,255,255,.35) inset, 0 2px 6px rgba(20,40,40,.06), 0 24px 48px -18px rgba(20,40,60,.28);
    --depth-hover: 0 1px 0 var(--glass-edge) inset, 0 0 0 1px rgba(255,255,255,.45) inset, 0 4px 10px rgba(20,40,40,.08), 0 36px 64px -20px rgba(20,40,60,.36);
    --blur: blur(28px) saturate(170%); --shadow: var(--depth);
    --brand: #0f766e; --brand-ink: #ffffff; --brand-soft: rgba(15,118,110,.13); --user: #0f766e; --user-ink: #ffffff;
    --bot: rgba(255,255,255,.62); --warn: #b45309; --warn-soft: rgba(245,170,60,.20); --err: #b91c1c; --err-soft: rgba(220,40,40,.10);
    --ring-idle: #a9c2be; --ring-listen: #0891b2; --ring-think: #0f766e; --ring-speak: #14b8a6;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --base: #070b0f; --ink: #eef4f3; --ink-2: #c4d0cd; --muted: #97a6a3;
      --panel: #1d272c; --bg: rgba(0,0,0,.24); --wash: rgba(255,255,255,.06); --line: rgba(255,255,255,.10);
      --glass: rgba(38,48,54,.46); --glass-strong: rgba(44,56,62,.76); --glass-edge: rgba(255,255,255,.16);
      --well: rgba(0,0,0,.24); --well-edge: rgba(255,255,255,.06); --glow: rgba(255,255,255,.10);
      --blob-1: #0e6b62; --blob-2: #1d3f8a; --blob-3: #4b2a7a; --blob-4: #7a3b1f;
      --depth: 0 1px 0 var(--glass-edge) inset, 0 0 0 1px rgba(255,255,255,.07) inset, 0 24px 56px -20px rgba(0,0,0,.7);
      --depth-hover: 0 1px 0 var(--glass-edge) inset, 0 0 0 1px rgba(255,255,255,.12) inset, 0 36px 72px -20px rgba(0,0,0,.8);
      --blur: blur(28px) saturate(170%); --shadow: var(--depth);
      --brand: #2dd4bf; --brand-ink: #04201c; --brand-soft: rgba(45,212,191,.16); --user: #14b8a6; --user-ink: #04201c;
      --bot: rgba(255,255,255,.08); --warn: #fbbf24; --warn-soft: rgba(251,191,36,.16); --err: #f87171; --err-soft: rgba(248,113,113,.14);
      --ring-idle: #3d524d; --ring-listen: #22d3ee; --ring-think: #2dd4bf; --ring-speak: #5eead4;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --base: #070b0f; --ink: #eef4f3; --ink-2: #c4d0cd; --muted: #97a6a3;
    --panel: #1d272c; --bg: rgba(0,0,0,.24); --wash: rgba(255,255,255,.06); --line: rgba(255,255,255,.10);
    --glass: rgba(38,48,54,.46); --glass-strong: rgba(44,56,62,.76); --glass-edge: rgba(255,255,255,.16);
    --well: rgba(0,0,0,.24); --well-edge: rgba(255,255,255,.06); --glow: rgba(255,255,255,.10);
    --blob-1: #0e6b62; --blob-2: #1d3f8a; --blob-3: #4b2a7a; --blob-4: #7a3b1f;
    --depth: 0 1px 0 var(--glass-edge) inset, 0 0 0 1px rgba(255,255,255,.07) inset, 0 24px 56px -20px rgba(0,0,0,.7);
    --depth-hover: 0 1px 0 var(--glass-edge) inset, 0 0 0 1px rgba(255,255,255,.12) inset, 0 36px 72px -20px rgba(0,0,0,.8);
    --blur: blur(28px) saturate(170%); --shadow: var(--depth);
    --brand: #2dd4bf; --brand-ink: #04201c; --brand-soft: rgba(45,212,191,.16); --user: #14b8a6; --user-ink: #04201c;
    --bot: rgba(255,255,255,.08); --warn: #fbbf24; --warn-soft: rgba(251,191,36,.16); --err: #f87171; --err-soft: rgba(248,113,113,.14);
    --ring-idle: #3d524d; --ring-listen: #22d3ee; --ring-think: #2dd4bf; --ring-speak: #5eead4;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { background: var(--bg); color: var(--ink); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  button { font: inherit; }
  :focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }

  /* ---- header ---- */
  header {
    display: flex; align-items: center; gap: 10px; padding: 12px 20px; flex-wrap: wrap;
    border-bottom: 1px solid var(--line); background: var(--panel);
  }
  header h1 { font-size: 17px; margin: 0; font-weight: 650; }
  header h1 span { color: var(--muted); font-weight: 450; }
  .badge { font-size: 12px; padding: 3px 9px; border-radius: 999px; background: var(--brand-soft); color: var(--brand); font-weight: 600; white-space: nowrap; }
  .spacer { flex: 1; }
  .btn {
    display: inline-flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 600; padding: 7px 12px;
    border-radius: 10px; border: 1px solid var(--line); background: var(--panel); color: var(--ink);
    text-decoration: none; cursor: pointer; white-space: nowrap;
  }
  .btn svg { width: 16px; height: 16px; }
  .btn:hover { border-color: var(--brand); }
  .switch { display: inline-flex; align-items: center; gap: 8px; font-size: 14px; color: var(--ink-2); cursor: pointer; user-select: none; }
  .switch input { appearance: none; width: 34px; height: 20px; border-radius: 999px; background: var(--line); position: relative; cursor: pointer; margin: 0; transition: background .2s; }
  .switch input::after { content: ""; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%; background: var(--panel); box-shadow: 0 1px 2px rgba(0,0,0,.2); transition: transform .2s; }
  .switch input:checked { background: var(--brand); }
  .switch input:checked::after { transform: translateX(14px); }

  main {
    display: grid; grid-template-columns: minmax(290px, 360px) 1fr; gap: 20px;
    max-width: 1180px; margin: 0 auto; padding: 20px; height: calc(100% - 61px);
  }
  main > * { min-width: 0; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; box-shadow: var(--shadow); }

  /* ---- speaker: the orb is the talk button ---- */
  .left { display: flex; flex-direction: column; overflow: auto; }
  .speaker { padding: 26px 20px 20px; display: flex; flex-direction: column; align-items: center; gap: 12px; }
  .orb {
    width: 148px; height: 148px; border-radius: 50%; position: relative; display: grid; place-items: center;
    border: none; padding: 0; cursor: pointer; color: var(--brand);
    background: radial-gradient(circle at 50% 50%, var(--panel) 56%, transparent 57%), conic-gradient(var(--ring), var(--ring));
    --ring: var(--ring-idle); transition: transform .15s;
  }
  .orb:hover:not(:disabled) { transform: scale(1.03); }
  .orb:disabled { cursor: default; }
  .orb svg { width: 40px; height: 40px; }
  .orb .stop { display: none; }
  .orb::after { content: ""; position: absolute; inset: -8px; border-radius: 50%; border: 3px solid var(--ring); opacity: 0; }
  .orb[data-state="listening"] { --ring: var(--ring-listen); color: var(--ring-listen); }
  .orb[data-state="thinking"] { --ring: var(--ring-think); }
  .orb[data-state="speaking"] { --ring: var(--ring-speak); color: var(--ring-speak); }
  .orb[data-state="listening"] .mic-glyph, .orb[data-state="speaking"] .mic-glyph { display: none; }
  .orb[data-state="listening"] .stop, .orb[data-state="speaking"] .stop { display: block; }
  .orb[data-state="listening"]::after, .orb[data-state="speaking"]::after { opacity: .5; animation: pulse 1.4s ease-out infinite; }
  .orb[data-state="thinking"] {
    background: radial-gradient(circle at 50% 50%, var(--panel) 56%, transparent 57%),
                conic-gradient(from var(--spin, 0deg), var(--ring) 0 30%, var(--ring-idle) 30% 100%);
    animation: spin 1s linear infinite;
  }
  @property --spin { syntax: "<angle>"; inherits: false; initial-value: 0deg; }
  @keyframes spin { to { --spin: 360deg; } }
  @keyframes pulse { from { transform: scale(.96); opacity: .6; } to { transform: scale(1.12); opacity: 0; } }
  .status { font-size: 16px; font-weight: 600; min-height: 24px; text-align: center; }
  .hint { font-size: 13px; color: var(--muted); text-align: center; margin: 0; min-height: 20px; }
  kbd { font: 12px ui-monospace, Menlo, monospace; padding: 1px 5px; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 5px; color: var(--ink-2); }

  /* ---- examples, grouped ---- */
  .examples { padding: 14px 20px 20px; border-top: 1px solid var(--line); }
  .examples h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 0 0 8px; }
  .group { margin-bottom: 12px; }
  .group h3 { font-size: 13px; font-weight: 650; margin: 0 0 6px; display: flex; align-items: center; gap: 6px; color: var(--ink-2); }
  .group h3 svg { width: 15px; height: 15px; color: var(--brand); }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip {
    font-size: 13.5px; text-align: left; padding: 6px 11px; border-radius: 999px; cursor: pointer; line-height: 1.35;
    color: var(--ink); background: var(--bg); border: 1px solid var(--line);
  }
  .chip:hover:not(:disabled) { border-color: var(--brand); background: var(--brand-soft); }
  .chip:disabled { opacity: .5; cursor: default; }

  /* ---- conversation ---- */
  .convo { display: flex; flex-direction: column; min-height: 0; }
  .log { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 14px; }
  .welcome { margin: auto; text-align: center; max-width: 440px; padding: 12px; }
  .welcome h2 { font-size: 22px; margin: 0 0 6px; }
  .welcome p { color: var(--muted); margin: 0 0 16px; }
  .welcome .chips { justify-content: center; }
  .msg { max-width: 78%; display: flex; flex-direction: column; gap: 6px; }
  .msg .bubble { padding: 10px 14px; border-radius: 16px; white-space: pre-wrap; overflow-wrap: anywhere; }
  .msg.user { align-self: flex-end; align-items: flex-end; }
  .msg.user .bubble { background: var(--user); color: var(--user-ink); border-bottom-right-radius: 4px; }
  .msg.bot .bubble { background: var(--bot); border-bottom-left-radius: 4px; }
  .msg.update .bubble { background: var(--brand-soft); }
  .msg.confirm .bubble { background: var(--warn-soft); }
  .msg.ring .bubble { background: var(--warn-soft); border: 1px solid var(--warn); }
  .msg.ring .tag { color: var(--warn); }
  .msg.ring.ringing .bubble { animation: ringing 1s ease-in-out infinite; }
  .msg .photo { display: block; max-width: min(100%, 360px); max-height: 320px; margin-top: 10px; border-radius: 12px; object-fit: cover; }
  .msg .clip { display: flex; align-items: center; gap: 8px; margin-top: 8px; font-size: 13px; color: var(--muted); }
  .msg .clip audio { height: 34px; max-width: 100%; }
  @keyframes ringing { 0%, 100% { box-shadow: 0 0 0 0 transparent; } 50% { box-shadow: 0 0 0 6px var(--warn-soft); } }
  .meta { font-size: 12px; color: var(--muted); display: flex; gap: 6px; align-items: center; }
  .tag { font-weight: 650; color: var(--brand); }
  .msg.confirm .tag { color: var(--warn); }
  .via { font-size: 12.5px; color: var(--muted); }
  .via summary { cursor: pointer; list-style: none; display: inline-flex; gap: 6px; align-items: center; flex-wrap: wrap; }
  .via summary::-webkit-details-marker { display: none; }
  .via summary::before { content: "▸"; }
  .via[open] summary::before { content: "▾"; }
  .used { padding: 1px 8px; border-radius: 999px; background: var(--panel); border: 1px solid var(--line); color: var(--ink-2); }
  .used.error { color: var(--err); border-color: var(--err); }
  .via pre {
    margin: 6px 0 0; padding: 8px 10px; border: 1px solid var(--line); border-radius: 10px; background: var(--panel);
    white-space: pre-wrap; overflow-wrap: anywhere; font: 12px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--muted);
  }
  .typing .bubble { display: inline-flex; gap: 4px; padding: 14px 16px; }
  .typing i { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); animation: blink 1.2s infinite; }
  .typing i:nth-child(2) { animation-delay: .2s; } .typing i:nth-child(3) { animation-delay: .4s; }
  @keyframes blink { 0%, 80%, 100% { opacity: .25; } 40% { opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { .orb, .orb::after, .typing i, .msg.ring .bubble { animation: none !important; } }
  .quick { display: flex; gap: 8px; }
  .quick button { font-weight: 650; padding: 8px 18px; border-radius: 10px; border: none; cursor: pointer; background: var(--brand); color: var(--brand-ink); }
  .quick button.no { background: var(--panel); color: var(--ink); border: 1px solid var(--line); }
  .error-banner { margin: 0 20px 10px; padding: 9px 12px; border-radius: 10px; background: var(--err-soft); color: var(--err); font-size: 14px; }
  .composer { display: flex; gap: 8px; padding: 12px; border-top: 1px solid var(--line); align-items: center; }
  .composer input {
    flex: 1; min-width: 0; font: inherit; padding: 11px 14px; border-radius: 12px; color: var(--ink);
    background: var(--bg); border: 1px solid var(--line);
  }
  .icon-btn {
    width: 44px; height: 44px; flex: none; border-radius: 12px; border: 1px solid var(--line); cursor: pointer;
    display: grid; place-items: center; background: var(--panel); color: var(--ink-2);
  }
  .icon-btn svg { width: 20px; height: 20px; }
  .icon-btn.primary { background: var(--brand); color: var(--brand-ink); border-color: var(--brand); }
  .icon-btn[aria-pressed="true"] { background: var(--ring-listen); border-color: var(--ring-listen); color: #fff; }
  .icon-btn:disabled { opacity: .45; cursor: not-allowed; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

  @media (max-width: 800px) {
    header { padding: 10px 16px; flex-wrap: nowrap; gap: 8px; }
    header h1 span, header .btn-label, .switch .switch-label { display: none; }
    header .btn { padding: 7px 9px; }
    .badge { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
    main { display: flex; flex-direction: column; height: auto; padding: 12px 16px; gap: 12px; }
    /* phone order: speaker, then the conversation, then more examples */
    .left { display: contents; }
    .speaker, .examples { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; }
    .speaker { order: 0; } .convo { order: 1; } .examples { order: 2; }
    .speaker { flex-direction: row; padding: 12px 14px; gap: 14px; }
    .orb { width: 72px; height: 72px; flex: none; }
    .orb svg { width: 26px; height: 26px; }
    .speaker-text { text-align: left; }
    .status, .hint { text-align: left; }
    .examples { padding: 12px 16px 14px; }
    .group .chips { flex-wrap: nowrap; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; }
    .chip { flex: none; }
    .convo { height: calc(100dvh - 200px); min-height: 420px; }
    .msg { max-width: 92%; }
    .hide-small { display: none; }
  }

  /* ================= spatial layer =================
     Frosted-glass panels float over a slowly drifting colour backdrop (the same design as the dashboard). */
  html { background: var(--base); }
  body { background: transparent; font-family: -apple-system, "SF Pro Text", system-ui, "Segoe UI", Roboto, sans-serif; -webkit-font-smoothing: antialiased; }
  .backdrop { position: fixed; inset: 0; z-index: -1; overflow: hidden; pointer-events: none; }
  .backdrop i { position: absolute; width: 58vmax; height: 58vmax; border-radius: 50%; filter: blur(90px); opacity: .75; }
  .backdrop i:nth-child(1) { background: var(--blob-1); top: -22vmax; left: -14vmax; animation: drift1 38s ease-in-out infinite alternate; }
  .backdrop i:nth-child(2) { background: var(--blob-2); top: -10vmax; right: -20vmax; animation: drift2 44s ease-in-out infinite alternate; }
  .backdrop i:nth-child(3) { background: var(--blob-3); bottom: -26vmax; left: 18vmax; animation: drift3 50s ease-in-out infinite alternate; }
  .backdrop i:nth-child(4) { background: var(--blob-4); bottom: -30vmax; right: -12vmax; opacity: .45; animation: drift1 56s ease-in-out infinite alternate-reverse; }
  @keyframes drift1 { to { transform: translate(8vmax, 6vmax) scale(1.08); } }
  @keyframes drift2 { to { transform: translate(-10vmax, 8vmax) scale(.94); } }
  @keyframes drift3 { to { transform: translate(6vmax, -8vmax) scale(1.1); } }

  .card, .ornament, .glass {
    background: var(--glass); -webkit-backdrop-filter: var(--blur); backdrop-filter: var(--blur); box-shadow: var(--depth); border: none;
  }
  @supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) {
    .card, .ornament, .glass { background: var(--glass-strong); }
  }
  @media (prefers-reduced-transparency: reduce) {
    .card, .ornament, .glass { background: var(--glass-strong); -webkit-backdrop-filter: none; backdrop-filter: none; }
    .backdrop i { opacity: .25; }
  }
  .ornament { background: var(--glass-strong); }  /* toolbars stay legible over content scrolling under them */
  .card { border-radius: 26px; position: relative; isolation: isolate; transition: box-shadow .35s, transform .35s cubic-bezier(.2,.8,.2,1); }
  .card::before { /* a glow that follows the pointer, like gaze on Vision Pro */
    content: ""; position: absolute; inset: 0; border-radius: inherit; z-index: -1; opacity: 0; transition: opacity .3s; pointer-events: none;
    background: radial-gradient(420px circle at var(--mx, 50%) var(--my, 50%), var(--glow), transparent 60%);
  }
  .card:hover { box-shadow: var(--depth-hover); }
  .card:hover::before { opacity: 1; }

  /* floating toolbar */
  header { position: sticky; top: 14px; z-index: 10; display: block; max-width: var(--page, 1180px); margin: 14px auto 0; padding: 0 20px; background: none; border: none; }
  .ornament { display: flex; align-items: center; gap: 10px; padding: 8px 8px 8px 14px; border-radius: 999px; }
  .logo { width: 34px; height: 34px; border-radius: 50%; flex: none; display: grid; place-items: center; color: #fff;
    background: linear-gradient(140deg, #2dd4bf, #2a78d6); box-shadow: 0 1px 0 rgba(255,255,255,.5) inset, 0 6px 14px -4px rgba(42,120,214,.6); }
  .logo svg { width: 18px; height: 18px; }
  header h1 { letter-spacing: -.01em; }

  /* capsule buttons that brighten under the pointer */
  .btn { border: none; border-radius: 999px; background: var(--well); box-shadow: 0 0 0 1px var(--well-edge) inset; color: var(--ink);
    transition: background .2s, transform .2s, box-shadow .2s; }
  .btn:hover:not(:disabled) { background: var(--glass-strong); box-shadow: 0 0 0 1px var(--glass-edge) inset, 0 6px 16px -6px rgba(0,0,0,.25); transform: translateY(-1px); }
  .btn:active:not(:disabled) { transform: scale(.97); }
  .btn.primary { background: var(--brand); color: var(--brand-ink); box-shadow: 0 1px 0 rgba(255,255,255,.35) inset, 0 8px 18px -8px var(--brand); }
  .btn.primary:hover:not(:disabled) { background: color-mix(in srgb, var(--brand) 88%, #fff); }

  /* recessed fields */
  input:not([type="checkbox"]) { border: none; border-radius: 12px; background: var(--well);
    box-shadow: 0 0 0 1px var(--well-edge) inset, 0 1px 2px rgba(0,0,0,.06) inset; transition: box-shadow .2s, background .2s; }
  input:not([type="checkbox"]):hover { box-shadow: 0 0 0 1px color-mix(in srgb, var(--brand) 35%, transparent) inset; }
  input:not([type="checkbox"]):focus { outline: none; background: var(--glass-strong); box-shadow: 0 0 0 2px var(--brand) inset, 0 0 0 5px var(--brand-soft); }

  .toast { background: var(--glass-strong); color: var(--ink); -webkit-backdrop-filter: var(--blur); backdrop-filter: var(--blur);
    box-shadow: var(--depth); border-radius: 999px; font-weight: 550; }

  @media (prefers-reduced-motion: reduce) {
    .backdrop i { animation: none !important; }
    .card, .btn, .btn:hover:not(:disabled) { transition: none; transform: none; }
  }
  @media (max-width: 900px) {
    header { top: 10px; margin-top: 10px; padding: 0 16px; }
    .ornament { padding: 6px 6px 6px 10px; gap: 8px; border-radius: 22px; }
    .logo { width: 30px; height: 30px; }
    .card { border-radius: 22px; }
  }

  :root { --page: 1180px; }
  body { display: flex; flex-direction: column; }
  main { flex: 1; min-height: 0; height: auto; width: 100%; padding-top: 18px; }
  header { width: 100%; }
  .badge { background: var(--brand-soft); }
  .switch input { background: var(--well); box-shadow: 0 0 0 1px var(--well-edge) inset; }
  .switch input:checked { background: var(--brand); }
  .left { overflow: hidden; }
  .left > * { position: relative; }
  .examples { border-top-color: var(--line); }
  /* the orb: a glass sphere floating in the panel */
  .orb { box-shadow: 0 1px 0 rgba(255,255,255,.6) inset, 0 28px 50px -18px color-mix(in srgb, var(--ring) 70%, transparent), 0 0 0 10px var(--well); }
  .chip { border: none; background: var(--well); box-shadow: 0 0 0 1px var(--well-edge) inset; transition: background .2s, transform .2s; }
  .chip:hover:not(:disabled) { background: var(--glass-strong); box-shadow: 0 0 0 1px var(--glass-edge) inset, 0 6px 14px -6px rgba(0,0,0,.25); transform: translateY(-1px); }
  .msg .bubble { border-radius: 20px; }
  .msg.user .bubble { background: linear-gradient(135deg, color-mix(in srgb, var(--user) 85%, #2dd4bf), var(--user));
    box-shadow: 0 1px 0 rgba(255,255,255,.3) inset, 0 10px 22px -12px var(--user); border-bottom-right-radius: 6px; }
  .msg.bot .bubble { background: var(--bot); box-shadow: 0 1px 0 var(--glass-edge) inset, 0 0 0 1px var(--well-edge) inset, 0 8px 20px -14px rgba(0,0,0,.3); border-bottom-left-radius: 6px; }
  .msg.update .bubble { background: var(--brand-soft); }
  .msg.confirm .bubble, .msg.ring .bubble { background: var(--warn-soft); }
  .msg.ring.update .bubble { background: var(--brand-soft); border-color: var(--brand); }  /* a message from the family */
  .msg.ring.update .tag { color: var(--brand); }
  .used { border: none; background: var(--well); box-shadow: 0 0 0 1px var(--well-edge) inset; }
  .via pre { border: none; background: var(--well); border-radius: 14px; }
  .quick button { border-radius: 999px; box-shadow: 0 1px 0 rgba(255,255,255,.35) inset, 0 8px 18px -8px var(--brand); }
  .quick button.no { border: none; background: var(--well); box-shadow: 0 0 0 1px var(--well-edge) inset; }
  .error-banner { border-radius: 14px; }
  .composer { border-top: none; margin: 0 10px 10px; padding: 6px; border-radius: 999px; background: var(--well); box-shadow: 0 0 0 1px var(--well-edge) inset; }
  .composer input, .composer input:hover, .composer input:focus { background: none; box-shadow: none; }
  .composer:focus-within { box-shadow: 0 0 0 2px var(--brand) inset, 0 0 0 5px var(--brand-soft); }
  .icon-btn { border: none; border-radius: 50%; background: var(--glass-strong); box-shadow: 0 1px 0 var(--glass-edge) inset, 0 4px 10px -4px rgba(0,0,0,.2); }
  .icon-btn.primary { background: var(--brand); box-shadow: 0 1px 0 rgba(255,255,255,.35) inset, 0 8px 18px -8px var(--brand); }
  kbd { background: var(--well); border-color: var(--line); }
  @media (max-width: 800px) {
    main { padding-top: 12px; }
    .speaker, .examples { background: var(--glass); -webkit-backdrop-filter: var(--blur); backdrop-filter: var(--blur); box-shadow: var(--depth); border: none; border-radius: 22px; }
    .convo { height: calc(100dvh - 220px); }
    .orb { box-shadow: 0 1px 0 rgba(255,255,255,.6) inset, 0 16px 30px -12px color-mix(in srgb, var(--ring) 70%, transparent), 0 0 0 6px var(--well); }
  }
</style>
</head>
<body>
<div class="backdrop" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
<header>
 <div class="ornament">
  <div class="logo" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 11c0 5.6-7 10-7 10Z"/></svg></div>
  <h1>Kinvesper <span>· voice simulator</span></h1>
  <span class="badge" id="mode">connecting…</span>
  <div class="spacer"></div>
  <label class="switch" title="Speak replies aloud"><input type="checkbox" id="speakToggle" checked aria-label="Speak replies"> <span class="switch-label">Speak replies</span></label>
  <button class="btn" id="restart" type="button" title="Start a new conversation">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg>
    <span class="btn-label">New conversation</span>
  </button>
  <a class="btn" id="dashLink" href="/dashboard" title="Caregiver dashboard">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg>
    <span class="btn-label">Caregiver dashboard</span>
  </a>
 </div>
</header>
<main>
  <section class="card left" aria-label="Speaker">
    <div class="speaker">
      <button class="orb" id="orb" data-state="idle" aria-label="Talk" disabled>
        <svg class="mic-glyph" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
        <svg class="stop" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="7" y="7" width="10" height="10" rx="2"/></svg>
      </button>
      <div class="speaker-text">
        <div class="status" id="status" role="status" aria-live="polite">Starting…</div>
        <p class="hint" id="hint"></p>
      </div>
    </div>
    <div class="examples">
      <h2>Try saying</h2>
      <div id="examples"></div>
    </div>
  </section>
  <section class="card convo" aria-label="Conversation">
    <div class="log" id="log" aria-live="polite"></div>
    <div class="error-banner" id="error" role="alert" hidden></div>
    <form class="composer" id="composer">
      <button class="icon-btn" id="mic" type="button" aria-pressed="false" aria-label="Talk" disabled>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
      </button>
      <label class="sr" for="text">Message</label>
      <input id="text" autocomplete="off" placeholder="Type what you'd say…" disabled>
      <button class="icon-btn primary" type="submit" id="send" aria-label="Send" disabled>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
      </button>
    </form>
  </section>
</main>
<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const key = new URLSearchParams(location.search).get("key") || "";
  const keyHeader = key ? { "X-Simulator-Key": key } : {};
  const headers = { "Content-Type": "application/json", ...keyHeader };
  let sid = null, caregiver = "family", patient = "", meds = [], smart = false, busy = false, heardByVoice = false;
  let voiceInput = false;
  // Speech runs on the server (Transcribe or Whisper in, Amazon Polly out): browsers' built-in speech
  // support varies too much (Brave and Firefox can't recognise speech; Linux browsers often have no voices).
  const speech = window.speechSynthesis;
  let serverVoice = false, player = null;
  let recorder = null, recording = false, audioCtx = null;

  // What each tool did, in words, for the "how" line under a reply.
  const DID = {
    get_medication_schedule: "Checked the medicine schedule", log_medication_dose: "Logged a dose",
    add_medication: "Added a medicine", check_for_scam: "Checked for a scam", find_trusted_contact: "Looked up a trusted contact",
    daily_check_in: "Recorded how they feel", notify_caregiver: () => `Messaged ${caregiver}`, answer_family_question: "Sent the answer back", check_safe_word: "Checked the family safe word", add_to_wishlist: "Added to the wish list", emergency_help: "Sent an urgent alert",
    get_care_summary: "Summarised the week", request_pharmacy_refill: "Ordered a refill", set_reminder: "Set a reminder",
    list_reminders: "Checked reminders", cancel_reminder: "Cancelled a reminder",
    check_medicine_interactions: "Checked the FDA labels for interactions", get_family_messages: "Read the family's messages",
    start_conversation: "Started a chat", save_memory: () => `Saved a memory for ${caregiver}`,
  };
  const did = (name) => { const d = DID[name]; return typeof d === "function" ? d() : d || name; };
  const ICON = {
    pill: '<path d="M10.5 20.5 3.5 13.5a5 5 0 0 1 7-7l7 7a5 5 0 0 1-7 7Z"/><path d="m8.5 8.5 7 7"/>',
    shield: '<path d="M12 3 4 6v6c0 5 3.5 8 8 9 4.5-1 8-4 8-9V6Z"/>',
    family: '<circle cx="9" cy="8" r="3"/><path d="M3 20a6 6 0 0 1 12 0"/><circle cx="17" cy="9" r="2.5"/><path d="M15.5 20a5 5 0 0 1 6-4.6"/>',
    bell: '<path d="M6 16V11a6 6 0 0 1 12 0v5l2 2H4Z"/><path d="M10 20a2 2 0 0 0 4 0"/>',
    spark: '<path d="M12 3v4M12 17v4M3 12h4M17 12h4M6 6l2.5 2.5M15.5 15.5 18 18M6 18l2.5-2.5M15.5 8.5 18 6"/>',
  };
  const svg = (name) => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICON[name]}</svg>`;

  const TITLE = document.title;
  const IDLE = () => voiceInput ? "Tap the circle and speak" : "Type below to talk";
  const setState = (state, text) => { $("orb").dataset.state = state; $("status").textContent = text; };
  const showError = (text) => { $("error").textContent = text; $("error").hidden = !text; };
  const clock = () => new Date().toLocaleTimeString(undefined, { hour: "numeric", minute: "2-digit" });
  const greeting = () => { const h = new Date().getHours(); return h < 12 ? "Good morning" : h < 17 ? "Good afternoon" : "Good evening"; };

  function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text !== undefined) e.textContent = text; return e; }

  function addMessage(kind, text, { tag, calls, pending } = {}) {
    $("log").querySelector(".welcome")?.remove();
    const wrap = el("div", `msg ${kind}`);
    wrap.append(el("div", "bubble", text));
    const meta = el("div", "meta");
    if (tag) meta.append(el("span", "tag", tag));
    meta.append(el("span", "", clock()));
    wrap.append(meta);
    if (calls && calls.length) {
      const d = el("details", "via");
      const s = el("summary");
      for (const c of calls) {
        const label = pending && c.name === "notify_caregiver" ? `Asking before messaging ${caregiver}` : did(c.name);
        const used = el("span", "used" + (c.is_error ? " error" : ""), label + (c.as_task ? " · in the background" : ""));
        s.append(used);
      }
      const pre = el("pre", "", calls.map((c) => `${c.name}(${JSON.stringify(c.arguments)})${c.spoken ? `\n→ ${c.spoken}` : ""}`).join("\n\n"));
      d.append(s, pre);
      wrap.append(d);
    }
    $("log").append(wrap);
    wrap.scrollIntoView({ behavior: "smooth", block: "end" });
    return wrap;
  }

  function showTyping() {
    const t = el("div", "msg bot typing");
    const b = el("div", "bubble");
    b.innerHTML = "<i></i><i></i><i></i>";
    b.setAttribute("aria-label", "Kinvesper is thinking");
    t.append(b);
    $("log").append(t);
    t.scrollIntoView({ behavior: "smooth", block: "end" });
    return t;
  }

  function stopSpeaking() {
    if (player) { player.pause(); player = null; }
    speech && speech.cancel();
  }

  async function speak(text, then, { always = false } = {}) {
    let finished = false;
    const done = () => { if (finished) return; finished = true; setState("idle", IDLE()); then && then(); };
    if (!always && !$("speakToggle").checked) return done();
    if (serverVoice) {
      try {
        const r = await fetch(`/api/voice/sessions/${sid}/speech`, { method: "POST", headers, body: JSON.stringify({ text }) });
        if (r.ok) {
          const url = URL.createObjectURL(await r.blob());
          stopSpeaking();
          const audio = player = new Audio(url);
          audio.onplaying = () => setState("speaking", "Speaking… tap to stop");
          audio.onended = audio.onerror = audio.onpause = () => { URL.revokeObjectURL(url); if (player === audio) player = null; done(); };
          await audio.play();
          return;
        }
        if (r.status === 503) serverVoice = false;  // no Polly here: use the browser's voice from now on
      } catch { /* playback blocked or network error: try the browser's voice */ }
    }
    browserSpeak(text, done);
  }

  function browserSpeak(text, done) {
    if (!speech) return done();
    const u = new SpeechSynthesisUtterance(text);
    u.rate = 0.95;
    const voice = speech.getVoices().find((v) => v.lang === "en-US" && /natural|google|samantha/i.test(v.name));
    if (voice) u.voice = voice;
    let started = false;
    u.onstart = () => { started = true; setState("speaking", "Speaking… tap to stop"); };
    u.onend = u.onerror = done;
    speech.speak(u);
    // Some browsers (often on Linux) have no voices and never start: don't leave the page stuck.
    setTimeout(() => { if (!started) { speech.cancel(); done(); } }, 2500);
  }

  function confirmButtons(msg) {
    const row = el("div", "quick");
    for (const [label, cls] of [["Yes, send it", ""], ["No", "no"]]) {
      const b = el("button", cls, label);
      b.type = "button";
      b.onclick = () => { row.remove(); send(label.startsWith("Yes") ? "Yes" : "No"); };
      row.append(b);
    }
    msg.append(row);
  }

  function setBusy(value) {
    busy = value;
    document.querySelectorAll(".chip").forEach((c) => (c.disabled = value));
    $("send").disabled = value || !sid;
  }

  async function send(text) {
    text = text.trim();
    if (!text || !sid || busy) return;
    setBusy(true); showError("");
    stopSpeaking();
    stopAlarm();  // talking to it silences the alarm, as on an Echo
    document.querySelectorAll(".quick").forEach((q) => q.remove());
    addMessage("user", text);
    $("text").value = "";
    setState("thinking", "Thinking…");
    const typing = showTyping();
    try {
      const r = await fetch(`/api/voice/sessions/${sid}/turns`, { method: "POST", headers, body: JSON.stringify({ text }) });
      const data = await r.json();
      if (!r.ok) throw new Error(data.error || r.statusText);
      typing.remove();
      const msg = addMessage(data.awaiting_confirmation ? "bot confirm" : "bot", data.reply, {
        tag: data.awaiting_confirmation ? "Needs your OK" : undefined, calls: data.tool_calls,
        pending: data.awaiting_confirmation,
      });
      if (data.awaiting_confirmation) { confirmButtons(msg); msg.scrollIntoView({ behavior: "smooth", block: "end" }); }
      const voiceTurn = heardByVoice;
      speak(data.reply, () => { if (data.awaiting_confirmation && voiceTurn) startRecording(); });
    } catch (e) {
      typing.remove();
      showError(`Couldn't reach Kinvesper: ${e.message}. Try again in a moment.`);
      setState("idle", IDLE());
    } finally {
      setBusy(false); heardByVoice = false;
      if (!recording && matchMedia("(min-width: 801px)").matches) $("text").focus({ preventScroll: true });
    }
  }

  // ---- microphone: record, stop on silence, transcribe on the server ----
  const QUIET_RMS = 0.015, END_SILENCE_MS = 1200, NO_SPEECH_MS = 7000, MAX_MS = 15000;

  async function startRecording() {
    if (recording || busy || !sid) return;
    stopSpeaking();
    let stream;
    try {
      stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true } });
    } catch (e) {
      $("hint").textContent = e.name === "NotAllowedError"
        ? "Microphone blocked. Allow it in the browser's site settings, or type."
        : `Couldn't open the microphone (${e.name}). You can type instead.`;
      return;
    }
    const chunks = [];
    let heard = false;
    recorder = new MediaRecorder(stream);
    recorder.ondataavailable = (e) => { if (e.data.size) chunks.push(e.data); };
    recorder.onstop = () => {
      stream.getTracks().forEach((t) => t.stop());  // release the mic between requests
      recording = false; $("mic").setAttribute("aria-pressed", "false");
      if (!heard) return setState("idle", "I didn't hear anything. Tap and speak.");
      transcribe(new Blob(chunks, { type: recorder.mimeType || "audio/webm" }));
    };
    recorder.start();
    recording = true; $("mic").setAttribute("aria-pressed", "true");
    setState("listening", "Listening… tap to stop");

    // Stop by itself once the person has spoken and then gone quiet.
    audioCtx = audioCtx || new AudioContext();
    if (audioCtx.state === "suspended") audioCtx.resume();
    const source = audioCtx.createMediaStreamSource(stream);
    const analyser = audioCtx.createAnalyser();
    analyser.fftSize = 1024;
    source.connect(analyser);
    const samples = new Float32Array(analyser.fftSize);
    const begun = performance.now();
    let lastSound = begun;
    const timer = setInterval(() => {
      if (!recording) { clearInterval(timer); source.disconnect(); return; }
      analyser.getFloatTimeDomainData(samples);
      const rms = Math.sqrt(samples.reduce((sum, v) => sum + v * v, 0) / samples.length);
      const now = performance.now();
      if (rms > QUIET_RMS) { heard = true; lastSound = now; }
      if ((heard && now - lastSound > END_SILENCE_MS) || (!heard && now - begun > NO_SPEECH_MS) || now - begun > MAX_MS) {
        stopRecording();
      }
    }, 100);
  }

  function stopRecording() {
    if (recorder && recorder.state === "recording") recorder.stop();
  }

  async function transcribe(blob) {
    setState("thinking", "Listening back…");
    try {
      const r = await fetch(`/api/voice/sessions/${sid}/transcribe`, {
        method: "POST", headers: { "Content-Type": blob.type, ...keyHeader }, body: blob,
      });
      const data = await r.json();
      if (!r.ok) throw new Error(data.error || r.statusText);
      if (!data.text) return setState("idle", "I didn't catch that. Tap and try again.");
      heardByVoice = true;
      send(data.text);
    } catch (e) {
      showError(`Couldn't understand the recording: ${e.message}`);
      setState("idle", IDLE());
    }
  }

  // The orb and the composer's mic both talk; while speaking, a tap stops the voice instead.
  function talk() {
    const state = $("orb").dataset.state;
    if (state === "speaking") { stopSpeaking(); setState("idle", IDLE()); return; }
    if (!voiceInput) { $("text").focus(); return; }
    recording ? stopRecording() : startRecording();
  }

  function setupMic(enabled) {
    voiceInput = enabled && Boolean(navigator.mediaDevices?.getUserMedia && window.MediaRecorder);
    $("orb").disabled = false;
    $("mic").disabled = !voiceInput;
    if (!enabled) $("hint").textContent = "Voice input is off on this server. You can type instead.";
    else if (!voiceInput) $("hint").textContent = window.isSecureContext
      ? "This browser can't record audio. You can type instead." : "Voice input needs https (or localhost). You can type instead.";
    else $("hint").innerHTML = 'Or press <kbd>Space</kbd> to talk';
    $("orb").setAttribute("aria-label", voiceInput ? "Talk" : "Type a message");
  }

  function examples() {
    const [first, last] = [meds[0], meds[meds.length - 1]];  // from the household's medicine list (Settings)
    const groups = [
      ["pill", "Medicines", ["What pills do I need today?", first && `Did I take my ${first}?`,
        first && `I just took my ${first}.`, last && `Can you order more of my ${last}?`, "Can I take ibuprofen with my pills?"]],
      ["shield", "Scams and safety", ["A man called saying my grandson is in jail and needs gift cards for bail.",
        "A caller says he's my grandson. He said the safe word is sunflower.",
        "Someone from my bank called asking for my OTP.", "I'm feeling a bit dizzy today."]],
      ["family", "Family and company", [`Tell ${caregiver} I'm going to the doctor at 3.`, "Any messages for me?", "Let's chat.", "I'm fine, thank you."]],
      ["bell", "Reminders", [`Remind me to call ${caregiver} at 5 PM.`, "Set an alarm for my doctor's appointment tomorrow at 10 AM.",
        "What reminders do I have?"]],
      smart && ["spark", "Anything else", ["What's the weather today?", "Tell me a joke.", "What time is it?"]],
    ].filter(Boolean);
    $("examples").replaceChildren(...groups.map(([icon, title, items]) => {
      const g = el("div", "group");
      const h = el("h3");
      h.innerHTML = svg(icon);
      h.append(title);
      const chips = el("div", "chips");
      for (const text of items.filter(Boolean)) {
        const c = el("button", "chip", text);
        c.type = "button";
        c.onclick = () => send(text);
        chips.append(c);
      }
      g.append(h, chips);
      return g;
    }));
  }

  function welcome() {
    const w = el("div", "welcome");
    w.append(el("h2", "", `${greeting()}${patient ? `, ${patient}` : ""}`));
    w.append(el("p", "", voiceInput
      ? "Tap the circle and talk, the way you would to Alexa. Or type, or pick one of these."
      : "Type what you'd say to Alexa, or pick one of these."));
    const chips = el("div", "chips");
    for (const text of ["What pills do I need today?", "Someone called asking for gift cards", `Tell ${caregiver} I'm fine`]) {
      const c = el("button", "chip", text);
      c.type = "button";
      c.onclick = () => send(text);
      chips.append(c);
    }
    w.append(chips);
    $("log").replaceChildren(w);
  }

  // Reminders go off here the way they would on an Echo: Kinvesper says them out loud ("Margaret, it's
  // time to drink water."), even with "Speak replies" off. An important one (an alarm) is repeated
  // until Stop, like "Alexa, stop" on the Echo.
  let alarm = null;
  const MAX_REPEATS = 4;

  function stopAlarm() {
    if (!alarm) return;
    clearTimeout(alarm.timer);
    alarm.msg.classList.remove("ringing");
    alarm.msg.querySelector(".quick")?.remove();
    alarm = null;
    document.title = TITLE;
  }

  function sayReminder(text, then) {
    if (busy || recording) return setTimeout(() => sayReminder(text, then), 1000);  // let the current turn finish
    speak(text, then, { always: true });
  }

  // A family voice note: played after the spoken intro, with its own player to hear it again.
  function playClip(url, then) {
    stopSpeaking();
    const audio = player = new Audio(url);
    audio.onplaying = () => setState("speaking", "Playing the voice message… tap to stop");
    audio.onended = audio.onerror = audio.onpause = () => { if (player === audio) player = null; setState("idle", IDLE()); then && then(); };
    audio.play().catch(() => { setState("idle", IDLE()); then && then(); });
  }

  function ring(a) {
    const important = a.ring === "alarm";
    const from = a.sender || caregiver;
    const tag = important ? "Alarm" : a.ring === "message" ? (a.audio_url ? `Voice message from ${from}` : a.image_url ? `Photo from ${from}` : `Message from ${from}`) : "Reminder";
    const msg = addMessage(`bot ring${a.ring === "message" ? " update" : ""}`, a.text, { tag });
    const bubble = msg.querySelector(".bubble");
    if (a.image_url) {
      const img = el("img", "photo");
      img.src = a.image_url; img.alt = a.text; img.loading = "lazy";
      img.onload = () => msg.scrollIntoView({ behavior: "smooth", block: "end" });
      bubble.append(img);
    }
    if (a.audio_url) {
      const clip = el("div", "clip");
      const audio = el("audio");
      audio.controls = true; audio.preload = "none"; audio.src = a.audio_url;
      clip.append(audio);
      bubble.append(clip);
    }
    const say = (then) => sayReminder(a.text, a.audio_url ? () => playClip(a.audio_url, then) : then);
    if (document.hidden) document.title = `${a.ring === "message" ? "✉️" : "⏰"} ${tag} · ${TITLE}`;
    // Browsers won't play sound on a page nobody has clicked yet: offer a button to hear it.
    if (navigator.userActivation && !navigator.userActivation.hasBeenActive) {
      const row = el("div", "quick");
      const hear = el("button", "", "Tap to hear it");
      hear.type = "button";
      hear.onclick = () => { row.remove(); speak(a.text, a.audio_url ? () => playClip(a.audio_url) : null, { always: true }); };
      row.append(hear);
      msg.append(row);
      msg.scrollIntoView({ behavior: "smooth", block: "end" });
      return;
    }
    if (!important) return say();
    stopAlarm();
    msg.classList.add("ringing");
    const row = el("div", "quick");
    const stop = el("button", "", "Stop alarm");
    stop.type = "button";
    stop.onclick = () => { stopAlarm(); stopSpeaking(); };
    row.append(stop);
    msg.append(row);
    msg.scrollIntoView({ behavior: "smooth", block: "end" });
    const current = alarm = { msg, timer: null, said: 0 };
    const again = () => {
      if (alarm !== current) return;
      if (++current.said >= MAX_REPEATS) return stopAlarm();
      current.timer = setTimeout(() => alarm === current && sayReminder(a.text, again), 4000);
    };
    sayReminder(a.text, again);
  }

  async function pollAnnouncements() {
    // Keep checking in a background tab too, so a reminder still rings there.
    if (sid) {
      try {
        const r = await fetch(`/api/voice/sessions/${sid}/announcements`, { headers });
        if (r.ok) {
          for (const a of await r.json()) {
            if (a.ring) { ring(a); continue; }
            addMessage("bot update", a.text, { tag: "Update", calls: a.tool_calls });
            if (!busy && !recording) speak(a.text);
          }
        }
      } catch { /* try again next tick */ }
    }
    setTimeout(pollAnnouncements, 2000);
  }
  addEventListener("visibilitychange", () => { if (!document.hidden && !alarm) document.title = TITLE; });

  async function start() {
    setState("thinking", "Connecting…");
    try {
      const r = await fetch("/api/voice/sessions", { method: "POST", headers });
      const data = await r.json();
      if (!r.ok) throw new Error(data.error || r.statusText);
      sid = data.id; caregiver = data.caregiver; patient = data.patient || ""; meds = data.medications || [];
      smart = data.mode === "claude";
      const providers = { bedrock: "Claude · Amazon Bedrock", anthropic: "Claude · Claude API", ollama: "Local model · Ollama" };
      $("mode").textContent = smart ? providers[data.provider] : "Offline keyword router";
      $("text").disabled = $("send").disabled = false;
      serverVoice = Boolean(data.server_voice);
      setupMic(Boolean(data.voice_input));
      examples();
      welcome();
      setState("idle", IDLE());
      if (matchMedia("(min-width: 801px)").matches) $("text").focus({ preventScroll: true });  // no surprise keyboard on phones
    } catch (e) {
      $("mode").textContent = "offline";
      setState("idle", "Not connected");
      showError(`Couldn't start: ${e.message}. Reload the page to try again.`);
    }
  }

  async function restart() {
    stopSpeaking();
    stopRecording();
    stopAlarm();
    if (sid) fetch(`/api/voice/sessions/${sid}`, { method: "DELETE", headers }).catch(() => {});
    sid = null;
    showError("");
    $("log").replaceChildren();
    await start();
  }

  $("composer").onsubmit = (e) => { e.preventDefault(); send($("text").value); };
  $("orb").onclick = talk;
  $("mic").onclick = talk;
  $("restart").onclick = restart;
  addEventListener("keydown", (e) => {
    const typing = /^(INPUT|TEXTAREA|SELECT|BUTTON)$/.test(document.activeElement?.tagName) && document.activeElement.id !== "orb";
    if (e.code === "Space" && !typing && !e.repeat && sid) { e.preventDefault(); talk(); }
    if (e.key === "Escape") { stopSpeaking(); stopRecording(); stopAlarm(); }
  });
  addEventListener("pagehide", () => { if (sid) fetch(`/api/voice/sessions/${sid}`, { method: "DELETE", headers, keepalive: true }); });
  start();
  pollAnnouncements();
})();
</script>
<script>
  // The glow on a glass panel follows the pointer, the way a Vision Pro panel lights up where you look.
  document.addEventListener("pointermove", (e) => {
    const c = e.target.closest && e.target.closest(".card");
    if (!c) return;
    const r = c.getBoundingClientRect();
    c.style.setProperty("--mx", `${e.clientX - r.left}px`);
    c.style.setProperty("--my", `${e.clientY - r.top}px`);
  }, { passive: true });
</script>
</body>
